[pytest]
testpaths = tests
pythonpath = . tests
addopts = -q --tb=short
markers =
    needs_db: يلمس قاعدة بيانات فعلية (main.SessionLocal مباشرة، أو عبر
        admin_token/company_token/user_token/company_cookie_token/db). شغّل
        `pytest -m "not needs_db"` لتشغيل المجموعة الأمامية البحتة بلا أي
        اتصال شبكي، حتى لو كان TEST_DATABASE_URL معطوباً تماماً.
