<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة الأدمن</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    padding: 20px;
}

.card {
    background: #1e1e1e;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
}

button {
    margin: 5px;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }
.pending { background: #444; color: white; }

.status {
    margin-top: 5px;
    font-size: 14px;
}
</style>

</head>
<body>

<h2>لوحة إدارة الشركات</h2>

<div id="loginBox">
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none;">
    <div id="list"></div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";
let TOKEN = "";

async function loadCompanies() {
    const res = await fetch(`${API_URL}/admin/companies`);
    const data = await res.json();

    const list = document.getElementById("list");

    list.innerHTML = data.map(c => `
        <div class="card">
            <h3>${c.name}</h3>
            <p>${c.city} | ${c.spec}</p>
            <p>${c.phone}</p>

            <div class="status">
                الحالة: <b>${c.status}</b>
            </div>

            <button class="approve" onclick="setStatus(${c.id}, 'approved')" ${c.status === 'approved' ? 'disabled' : ''}>✔ موافقة</button>
            <button class="reject" onclick="setStatus(${c.id}, 'rejected')" ${c.status === 'rejected' ? 'disabled' : ''}>❌ رفض</button>
            <button class="pending" onclick="setStatus(${c.id}, 'pending')" ${c.status === 'pending' ? 'disabled' : ''}>⏳ قيد المراجعة</button>
        </div>
    `).join("");
}

async function setStatus(id, status) {
    const res = await fetch(`${API_URL}/companies/${id}/status`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": TOKEN,
        },
        body: JSON.stringify({ status }),
    });
    if (res.status === 401) {
        alert("غير مصرح. سجّل الدخول مجدداً.");
        logout();
        return;
    }
    loadCompanies();
}

function logout() {
    TOKEN = "";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("panel").style.display = "none";
}

async function login() {
    const username = document.getElementById("user").value;
    const password = document.getElementById("pass").value;

    const res = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password})
    });

    const data = await res.json();

    if(data.token){
        TOKEN = data.token;
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
        loadCompanies();
    } else {
        alert("خطأ في تسجيل الدخول");
    }
}


</script>

</body>
</html>
