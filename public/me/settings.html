<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — بُنيان</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../tokens.css">
<script>
  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<script src="../guard.js" data-require="user"></script>
<style>
.me-sec { margin-block-end:var(--bn-s8); }
.me-sec-t { font:var(--bn-t-h3); margin:0 0 var(--bn-s4); display:flex;
  align-items:center; gap:9px; }
.me-sec-t::before { content:""; width:5px; height:5px; border-radius:50%;
  background:var(--bn-ac); flex:none; }
.st-seg { display:flex; gap:6px; flex:none; }
.st-seg button { min-height:44px; min-width:64px; padding-inline:var(--bn-s3);
  border:1px solid var(--bn-line); border-radius:var(--bn-r); background:transparent;
  color:var(--bn-ink-2); cursor:pointer; font:400 13px/1 var(--bn-font);
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:color var(--bn-fast), border-color var(--bn-fast), background var(--bn-fast); }
.st-seg button:hover { color:var(--bn-ac); border-color:var(--bn-ac-line); }
.st-seg button.is-on { background:var(--bn-ac); color:var(--bn-ac-on); border-color:transparent; }
</style>
</head>
<body class="bn-body">

<div class="bn-backdrop" aria-hidden="true"></div>
<div id="bn-nav"></div>

<main class="me-wrap" id="main">
  <div class="me-head">
    <h1>الإعدادات</h1>
    <p>حسابك ومظهر الصفحة.</p>
  </div>

  <section class="me-sec">
    <h2 class="me-sec-t">المظهر</h2>
    <div class="sec-row bn-solid">
      <div class="sec-b">
        <div class="sec-t">وضع العرض</div>
        <div class="sec-d">يُحفظ في هذا المتصفّح وحده.</div>
      </div>
      <div class="st-seg" id="theme"></div>
    </div>
  </section>

  <section class="me-sec">
    <h2 class="me-sec-t">أمان الحساب</h2>
    <div id="security"></div>
  </section>

  <section class="me-sec">
    <h2 class="me-sec-t">الجلسة</h2>
    <div class="sec-row bn-solid">
      <div class="sec-b">
        <div class="sec-t">تسجيل الخروج</div>
        <div class="sec-d">ينهي جلستك في هذا المتصفّح.</div>
      </div>
      <button class="bn-btn bn-btn-ghost" type="button" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </section>
</main>

<script src="me-core.js"></script>
<script src="../account-security.js"></script>
<script src="nav-me.js"></script>
<script>
(function () {
'use strict';
const ME = window.MeCore;
const $ = (id) => document.getElementById(id);
const esc = ME.esc, svg = ME.svg;

/* ── المظهر ── */
const THEMES = [
  { k:'light', t:'نهاري', i:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>' },
  { k:'dark',  t:'ليلي', i:'<path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.7 6.7 0 0 0 9.5 9.5z"/>' }
];
function current() { try { return localStorage.getItem('bn-theme') || 'light'; } catch (e) { return 'light'; } }
function renderTheme() {
  const now = current();
  $('theme').innerHTML = THEMES.map(t =>
    '<button type="button" data-t="' + t.k + '"' + (now === t.k ? ' class="is-on"' : '') + '>' +
      svg(t.i, 15) + esc(t.t) + '</button>').join('');
  $('theme').querySelectorAll('[data-t]').forEach(b => {
    b.onclick = () => {
      try { localStorage.setItem('bn-theme', b.dataset.t); } catch (e) {}
      document.documentElement.setAttribute('data-theme', b.dataset.t);
      renderTheme();
    };
  });
}
renderTheme();

/* ── أمان الحساب — الوحدة المشتركة نفسها التي يستعملها app/ ── */
BunyanSecurity.mount($('security'), {
  api: ME.api, errText: ME.errText, toast: ME.toast,
  svg: ME.svg, icons: ME.icons
});

/* ── الخروج — ../login.html الاستثناء المصرَّح به ── */
$('logoutBtn').onclick = async function () {
  if (!await ME.confirm('تسجيل الخروج', 'ستحتاج إلى إدخال بياناتك مجدداً.', 'خروج')) return;
  try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
  try {
    localStorage.removeItem('bn_token');
    localStorage.removeItem('project_user_id');
    localStorage.removeItem('project_user_name');
  } catch (e) {}
  location.replace('../login.html');
};
})();
</script>
</body>
</html>
