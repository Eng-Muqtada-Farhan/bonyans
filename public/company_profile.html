<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف الشركة — بُنيان</title>
<meta name="description" id="metaDesc" content="ملف شركة مقاولات على منصة بُنيان.">
<meta property="og:type" content="profile">
<meta property="og:title" id="ogTitle" content="ملف الشركة — بُنيان">
<meta property="og:description" id="ogDesc" content="ملف شركة مقاولات على منصة بُنيان.">
<meta property="og:image" id="ogImage" content="">
<meta property="og:url" id="ogUrl" content="">
<meta name="twitter:card" content="summary">
<link rel="canonical" id="canon" href="">

<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">

  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();

<style>
/* ══════════════════════════════════════════════════════════════
   ملف الشركة — واجهتها أمام عميلها.
   مصمَّمة للحالة الفقيرة أولاً: أغلب الشركات تبدأ بلا صور ولا
   تقييمات، فيجب أن تبدو محترمة بذلك. كل قسم بلا بيانات يُظهر
   فراغه صراحةً ولا يُملأ ببديل (§٥·٥).
   ══════════════════════════════════════════════════════════════ */
body { margin:0; background:var(--bn-bg); color:var(--bn-ink);
  font:var(--bn-t-body); font-family:var(--bn-font); -webkit-font-smoothing:antialiased; }
.wrap { max-width:820px; margin-inline:auto; padding-inline:var(--bn-s5); }
@media(max-width:560px){ .wrap { padding-inline:var(--bn-s4); } }

.crumb { display:inline-flex; align-items:center; gap:6px; min-height:44px;
  color:var(--bn-ink-3); font:var(--bn-t-sm); text-decoration:none; }
.crumb:hover { color:var(--bn-ac); }

/* ── الترويسة ── */
.head { display:flex; gap:var(--bn-s5); align-items:flex-start;
  padding-block:var(--bn-s5) var(--bn-s6); }
.head-av { width:88px; height:88px; border-radius:var(--bn-r-lg); flex:none;
  display:grid; place-items:center; overflow:hidden;
  background:var(--bn-ac-bg); color:var(--bn-ac);
  border:1px solid var(--bn-ac-line); font:700 32px/1 var(--bn-font); }
.head-av img { width:100%; height:100%; object-fit:cover; }
.head-b { flex:1; min-width:0; }
.head-n { font:var(--bn-t-h1); margin:0 0 var(--bn-s2); display:flex;
  align-items:center; gap:9px; flex-wrap:wrap; letter-spacing:-.01em; }
.head-m { display:flex; align-items:center; gap:var(--bn-s4); flex-wrap:wrap;
  font:var(--bn-t-sm); color:var(--bn-ink-2); margin-block-end:var(--bn-s3); }
.head-m i { display:inline-flex; align-items:center; gap:5px; font-style:normal; }
.rate { display:inline-flex; align-items:center; gap:6px; }
.rate-n { font:700 17px/1 var(--bn-mono); color:var(--bn-ac);
  font-variant-numeric:tabular-nums; }
.rate-c { font:var(--bn-t-cap); color:var(--bn-ink-3); }
.rate-none { font:var(--bn-t-cap); color:var(--bn-ink-3); }
@media(max-width:560px){
  .head { gap:var(--bn-s4); }
  .head-av { width:64px; height:64px; font-size:24px; }
  .head-n { font-size:22px; }
}

/* ── التواصل ── */
.acts { display:flex; gap:var(--bn-s2); flex-wrap:wrap;
  padding-block-end:var(--bn-s6); border-block-end:1px solid var(--bn-line-soft); }
.acts .bn-btn { flex:1 1 auto; min-width:150px; }
.act-icon { display:inline-flex; align-items:center; justify-content:center;
  gap:7px; min-height:44px; padding-inline:var(--bn-s4);
  border:1px solid var(--bn-line); border-radius:var(--bn-r);
  background:transparent; color:var(--bn-ink-2); text-decoration:none;
  font:400 13.5px/1 var(--bn-font); cursor:pointer; flex:1 1 auto; min-width:130px;
  transition:color var(--bn-fast), border-color var(--bn-fast); }
.act-icon:hover { color:var(--bn-ac); border-color:var(--bn-ac-line); }
.acts-none { display:block; font:var(--bn-t-sm); color:var(--bn-ink-3); }

/* ── الأقسام ── */
.sec { padding-block:var(--bn-s8); border-block-end:1px solid var(--bn-line-soft); }
.sec:last-of-type { border-block-end:0; }
.sec-t { font:var(--bn-t-h3); margin:0 0 var(--bn-s4); display:flex;
  align-items:center; gap:9px; }
.sec-t::before { content:""; width:5px; height:5px; border-radius:50%;
  background:var(--bn-ac); flex:none; }
.about { font-size:14.5px; color:var(--bn-ink-2); line-height:1.9;
  margin:0; max-width:65ch; }

/* ── المعرض ── */
.gal { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:var(--bn-s3); }
.gal a { display:block; aspect-ratio:4/3; border-radius:var(--bn-r-lg);
  overflow:hidden; border:1px solid var(--bn-line-soft); }
.gal img { width:100%; height:100%; object-fit:cover; display:block; }

/* ── التقييمات ── */
.revs { display:flex; flex-direction:column; gap:var(--bn-s3); }
.rev { padding:var(--bn-s4); border-radius:var(--bn-r-lg); }
.rev-h { display:flex; align-items:center; justify-content:space-between;
  gap:var(--bn-s3); margin-block-end:var(--bn-s2); }
.rev-who { font:500 14px/1.4 var(--bn-font); }
.rev-when { font:var(--bn-t-cap); color:var(--bn-ink-3); }
.stars { display:inline-flex; gap:2px; color:var(--bn-ac); }
.stars .off { color:var(--bn-ink-3); opacity:.4; }
.rev-c { font-size:13.5px; color:var(--bn-ink-2); line-height:1.8; margin:6px 0 0; }
.rev-reply { margin-block-start:var(--bn-s3); padding:var(--bn-s3) var(--bn-s4);
  border-radius:var(--bn-r); background:var(--bn-ac-bg);
  border-inline-start:2px solid var(--bn-ac-line); }
.rev-reply-t { font:var(--bn-t-cap); color:var(--bn-ac); margin-block-end:5px; }
.rev-reply p { font-size:13px; color:var(--bn-ink-2); line-height:1.75; margin:0; }

/* ── الحالات الفارغة — صادقة لا مملوءة ببديل ── */
.empty { text-align:center; padding:var(--bn-s10) var(--bn-s5);
  border:1px dashed var(--bn-line); border-radius:var(--bn-r-lg); }
.empty svg { width:32px; height:32px; stroke:var(--bn-ink-3); fill:none;
  stroke-width:1.3; margin-block-end:var(--bn-s3); }
.empty-t { font:500 14px/1.5 var(--bn-font); color:var(--bn-ink-2); }
.empty-d { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:5px;
  max-width:40ch; margin-inline:auto; line-height:1.7; }

.state { text-align:center; padding:var(--bn-s18) var(--bn-s5); }
.state svg { width:38px; height:38px; stroke:var(--bn-ink-3); fill:none;
  stroke-width:1.3; margin-block-end:var(--bn-s3); }
.state-t { font:500 15px/1.5 var(--bn-font); color:var(--bn-ink-2); }
.state-d { font:var(--bn-t-sm); color:var(--bn-ink-3); margin-block-start:6px; }
.state .bn-btn { margin-block-start:var(--bn-s4); }
.skel { height:96px; border-radius:var(--bn-r-lg); background:var(--bn-glass-tint);
  border:1px solid var(--bn-line-soft); margin-block-end:var(--bn-s3); }

.report-row { display:flex; justify-content:flex-end;
  margin-block-start:var(--bn-s3); }
.toast { position:fixed; inset-block-end:var(--bn-s6); inset-inline:0;
  margin-inline:auto; width:max-content; max-width:88vw; z-index:500;
  padding:12px var(--bn-s5); border-radius:var(--bn-r-pill);
  background:var(--bn-ink); color:var(--bn-bg); font:var(--bn-t-sm);
  box-shadow:var(--bn-sh-3); opacity:0; transform:translateY(12px);
  pointer-events:none; transition:opacity var(--bn-mid), transform var(--bn-mid); }
.toast.is-on { opacity:1; transform:none; }
@media(max-width:820px){ .toast { inset-block-end:80px; } }
</style>
</head>
<body class="bn-body">

<div class="bn-backdrop" aria-hidden="true"></div>
<div id="bn-nav"></div>

<main class="wrap" id="main">
  <div class="skel" style="margin-block-start:var(--bn-s6)"></div>
  <div class="skel"></div>
</main>

<footer class="bn-legal-foot">
  <a href="privacy.html">سياسة الخصوصية</a>
  <a href="terms.html">شروط الاستخدام</a>
</footer>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script src="report.js"></script>
<script src="nav-public.js"></script>
<script>
(function () {
'use strict';

const API = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const initials = (n) => String(n||'').split(/\s+/).slice(0,2).map(w => w[0]||'').join('');

const IC = {
  pin:    '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  star:   '<path d="M12 3.7l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z"/>',
  check:  '<path d="M20 6L9 17l-5-5"/>',
  wa:     '<path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3.5 20.5l1.6-5A8.5 8.5 0 1 1 21 11.5z"/><path d="M8.9 8.4c.2-.5.4-.5.6-.5h.5c.2 0 .4 0 .6.5l.7 1.6c.1.2 0 .4-.1.5l-.4.5c-.1.2-.2.3-.1.5a5 5 0 0 0 2.3 2.2c.2.1.4.1.5-.1l.4-.5c.2-.2.3-.2.5-.1l1.6.8c.2.1.3.2.3.4a1.6 1.6 0 0 1-1.1 1.3c-.4.1-1 .2-2.6-.5a8.6 8.6 0 0 1-3.6-3.4c-.6-1.1-.6-1.8-.5-2.2a1.8 1.8 0 0 1 .4-1z"/>',
  phone:  '<path d="M21 16.5v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 3.7 2 2 0 0 1 3.1 1.5h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L7.1 9.3a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/>',
  map:    '<path d="M9 3.5 3 6v14.5l6-2.5 6 2.5 6-2.5V3.5l-6 2.5z"/><path d="M9 3.5V18M15 6v14.5"/>',
  image:  '<rect x="3" y="4.5" width="18" height="15" rx="1.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-9 8.5"/>',
  chat:   '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"/>',
  back:   '<path d="M9 6l6 6-6 6"/>',
  globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>',
  offline:'<path d="M3 3l18 18"/><path d="M5.5 12.5a9 9 0 0 1 3.2-2.1M2 8.8A14 14 0 0 1 6 6.3M18.5 6.3A14 14 0 0 1 22 8.8M15.4 10.5a9 9 0 0 1 3.1 2"/><circle cx="12" cy="18" r="1"/>',
  gone:   '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'
};
const svg = (d, s) => '<svg viewBox="0 0 24 24" width="' + (s||15) + '" height="' + (s||15) +
  '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
  'stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';

function toast(m) {
  $('toastMsg').textContent = m;
  $('toast').classList.add('is-on');
  setTimeout(() => $('toast').classList.remove('is-on'), 3000);
}

const ID = new URLSearchParams(location.search).get('id');
const digits = (p) => String(p || '').replace(/[^\d]/g, '');

/* wa.me يطلب الرقم بصيغة دولية بلا رموز. الأرقام العراقية تُدخَل
   محلياً (07XXXXXXXXX) فتُحوَّل إلى 9647XXXXXXXXX.
   رقم لا يطابق شكلاً صالحاً يُرجع null فلا يُبنى له زر أصلاً —
   زرٌّ يفتح محادثة فارغة أسوأ من غياب الزر. */
function waNumber(p) {
  var d = digits(p);
  if (d.slice(0, 4) === '0096') d = d.slice(2);
  if (d.slice(0, 3) === '964') d = d.slice(3);
  else if (d.charAt(0) === '0')  d = d.slice(1);
  return /^7\d{9}$/.test(d) ? '964' + d : null;
}
const callable = (p) => digits(p).length >= 7;

function stars(n) {
  var out = '';
  for (var i = 1; i <= 5; i++) {
    out += '<span class="' + (i <= Math.round(n) ? '' : 'off') + '">' + svg(IC.star, 13) + '</span>';
  }
  return '<span class="stars">' + out + '</span>';
}
function when(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('ar-IQ', { year:'numeric', month:'long' }); }
  catch (e) { return ''; }
}

/* ── الوسوم الوصفية من بيانات الشركة الحقيقية ──
   تنبيه: زواحف واتساب وجوجل لا تُشغّل JavaScript، فهذه تنفع تبويب
   المتصفّح والمشاركة من داخل التطبيق فقط. المشاركة الحقيقية
   تحتاج توليداً على الخادم — مسجَّل للمستخدم. */
function setMeta(c) {
  /* الحقول اختيارية في المخطط — تُحذف من النص إن غابت ولا تُستبدل */
  const bits  = [c.spec, c.city].filter(v => v && String(v).trim()).join(' · ');
  const title = c.name + (bits ? ' — ' + bits : '') + ' | بُنيان';
  const desc  = (c.desc && c.desc.trim())
    ? c.desc.trim().slice(0, 155)
    : c.name + (bits ? ' — ' + bits : '') + '. تواصل مباشرة عبر بُنيان.';
  document.title = title;
  $('ogTitle').content = title;
  $('metaDesc').content = desc;
  $('ogDesc').content = desc;
  $('ogUrl').content = location.href;
  $('canon').href = location.href;
  if (c.image_url) $('ogImage').content = c.image_url;
  else $('ogImage').remove();          /* لا صورة وهمية في المشاركة */
}

/* ── تسجيل نقرة واتساب — إحصائية تفيد الشركة ──
   لا يعطّل التدفّق إن فشل: الرابط يفتح دائماً. */
function trackWA(id) {
  try {
    fetch(API + '/company/' + encodeURIComponent(id) + '/wa-click', {
      method: 'POST', keepalive: true
    }).catch(() => {});
  } catch (e) { /* التسجيل ثانوي — لا يمنع التواصل */ }
}

function render(d, reviews) {
  const c = d.company;
  const gallery = d.gallery || [];
  setMeta(c);

  /* التقييم من التقييمات الحقيقية وحدها. عمود companies.rating
     افتراضه 5 حتى بلا مقيّم واحد، وعرضه ادّعاء (§٥·٥). */
  const n   = reviews.length;
  const avg = n ? reviews.reduce((s, r) => s + Number(r.rating || 0), 0) / n : 0;

  const av = c.image_url
    ? '<div class="head-av"><img src="' + esc(c.image_url) + '" alt=""></div>'
    : '<div class="head-av">' + esc(initials(c.name)) + '</div>';

  const rating = n
    ? '<span class="rate">' + stars(avg) +
        '<span class="rate-n">' + avg.toFixed(1) + '</span>' +
        '<span class="rate-c">(' + n + ' تقييم)</span></span>'
    : '<span class="rate-none">لا تقييمات بعد</span>';

  /* الأزرار تظهر لما له قيمة فعلاً — لا زر لرابط فارغ.
     «اطلب عرض سعر» يمرّ عبر واتساب لأنه القناة الوحيدة العاملة:
     لا يوجد في الخادم مسار طلب موجَّه لشركة بعينها، ووعدٌ بلا مسار
     خلفه ادّعاء. الرسالة مُعبّأة مسبقاً فيصل الطلب مفهوماً. */
  const acts = [];
  const wa = waNumber(c.phone);
  if (wa) {
    const waMsg = encodeURIComponent(
      'السلام عليكم، وجدت شركتكم على منصّة بُنيان وأودّ طلب عرض سعر.');
    acts.push('<a class="bn-btn" data-wa href="https://wa.me/' + wa + '?text=' + waMsg +
      '" target="_blank" rel="noopener">' + svg(IC.wa, 17) + ' اطلب عرض سعر</a>');
  }
  if (callable(c.phone)) {
    acts.push('<a class="' + (wa ? 'act-icon' : 'bn-btn') + '" href="tel:' + esc(digits(c.phone)) +
      '">' + svg(IC.phone, 16) + ' اتصال</a>');
  }
  if (c.map_link) {
    acts.push('<a class="act-icon" href="' + esc(c.map_link) +
      '" target="_blank" rel="noopener">' + svg(IC.map, 16) + ' الموقع على الخريطة</a>');
  }
  if (c.website) {
    acts.push('<a class="act-icon" href="' + esc(c.website) +
      '" target="_blank" rel="noopener">' + svg(IC.globe, 16) + ' الموقع الإلكتروني</a>');
  }

  const galHTML = gallery.length
    ? '<div class="gal">' + gallery.map(g =>
        '<a href="' + esc(g.image_url) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(g.image_url) + '" alt="' + esc(g.title || c.name) + '" loading="lazy"></a>'
      ).join('') + '</div>'
    : '<div class="empty">' + svg(IC.image, 32) +
        '<div class="empty-t">لم تُضف الشركة صور أعمال بعد</div>' +
        '<div class="empty-d">حين ترفع الشركة صور مشاريعها ستظهر هنا.</div></div>';

  const revHTML = n
    ? '<div class="revs">' + reviews.map(r =>
        '<div class="rev bn-solid">' +
          '<div class="rev-h">' +
            '<div><div class="rev-who">' + esc(r.client_name) + '</div>' +
              '<div class="rev-when">' + esc(when(r.created_at)) + '</div></div>' +
            stars(Number(r.rating) || 0) +
          '</div>' +
          (r.comment ? '<p class="rev-c">' + esc(r.comment) + '</p>' : '') +
          (r.reply ? '<div class="rev-reply"><div class="rev-reply-t">ردّ الشركة</div>' +
                     '<p>' + esc(r.reply) + '</p></div>' : '') +
          '<div class="report-row">' + BunyanReport.button('review', r.id) + '</div>' +
        '</div>').join('') + '</div>'
    : '<div class="empty">' + svg(IC.chat, 32) +
        '<div class="empty-t">لا تقييمات بعد</div>' +
        '<div class="empty-d">التقييمات تأتي من عملاء تعاملوا مع الشركة عبر بُنيان.</div></div>';

  $('main').innerHTML =
    '<a class="crumb" href="companies.html">' + svg(IC.back, 14) + ' دليل الشركات</a>' +

    '<header class="head">' + av +
      '<div class="head-b">' +
        '<h1 class="head-n">' + esc(c.name) +
          (c.verified ? '<span class="bn-badge bn-badge-verified">' + svg(IC.check, 11) + 'موثّقة</span>' : '') +
        '</h1>' +
        '<div class="head-m">' +
          (c.city ? '<i>' + svg(IC.pin, 14) + esc(c.city) + '</i>' : '') +
          (c.spec ? '<i>' + esc(c.spec) + '</i>' : '') +
        '</div>' +
        rating +
      '</div>' +
    '</header>' +

    (acts.length
      ? '<div class="acts">' + acts.join('') + '</div>'
      : '<div class="acts acts-none">لم تُسجّل الشركة وسيلة تواصل صالحة بعد.</div>') +

    (c.desc && c.desc.trim()
      ? '<section class="sec"><h2 class="sec-t">نبذة عن الشركة</h2>' +
        '<p class="about">' + esc(c.desc) + '</p></section>'
      : '') +

    '<section class="sec"><h2 class="sec-t">معرض الأعمال</h2>' + galHTML + '</section>' +

    '<section class="sec"><h2 class="sec-t">التقييمات' +
      (n ? ' <span class="rate-c">(' + n + ')</span>' : '') + '</h2>' + revHTML + '</section>' +

    /* الإبلاغ عن الملف — شرط Apple ١٫٢ */
    '<div class="report-row">' + BunyanReport.button('company', c.id, 'إبلاغ عن هذا الملف') + '</div>';

  BunyanReport.wire($('main'));

  /* نقرة واتساب تُسجَّل ثم يفتح الرابط طبيعياً */
  const waBtn = document.querySelector('[data-wa]');
  if (waBtn) waBtn.addEventListener('click', () => trackWA(c.id));
}

function fail(kind) {
  $('main').innerHTML = kind === 'gone'
    ? '<div class="state">' + svg(IC.gone, 38) +
      '<div class="state-t">هذه الشركة غير متاحة</div>' +
      '<div class="state-d">قد تكون أُزيلت أو لم تُعتمد بعد.</div>' +
      '<a class="bn-btn" href="companies.html">تصفّح الدليل</a></div>'
    : '<div class="state">' + svg(IC.offline, 38) +
      '<div class="state-t">تعذّر الاتصال بالخادم</div>' +
      '<div class="state-d">تحقّق من اتصالك ثم أعد المحاولة.</div>' +
      '<button class="bn-btn" type="button" onclick="location.reload()">إعادة المحاولة</button></div>';
}

(async function load() {
  if (!ID) { fail('gone'); return; }
  try {
    const r = await fetch(API + '/company/' + encodeURIComponent(ID), { signal: AbortSignal.timeout(12000) });
    if (r.status === 404) { fail('gone'); return; }
    if (!r.ok) { fail('net'); return; }
    const d = await r.json();

    /* التقييمات ثانوية: فشلها لا يمنع عرض الملف */
    let reviews = [];
    try {
      const rr = await fetch(API + '/company/' + encodeURIComponent(ID) + '/reviews');
      if (rr.ok) reviews = await rr.json();
    } catch (e) {}

    render(d, reviews);
  } catch (e) { fail('net'); }
})();

})();
</script>
<script src="sw-update.js"></script>
</body>
</html>
