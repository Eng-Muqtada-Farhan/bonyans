<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل شركات المقاولات — بُنيان</title>
<meta name="description" content="دليل شامل لشركات المقاولات والتشييد في العراق — ابحث، قارن، وتواصل مباشرة.">
<meta name="keywords" content="دليل شركات مقاولات, بناء, العراق, بغداد, البصرة, الموصل">
<meta property="og:title" content="دليل شركات المقاولات — بُنيان">
<meta property="og:description" content="اعثر على شركة المقاولات المناسبة في مدينتك">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-bn-font
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<script>
  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<style>
/* ══════════════════════════════════════════════════════════════
   دليل الشركات — الصفحة الكاملة.
   الفلاتر والصفوف والحالات كلها من bn-filters.js، فلا نسخة ثانية
   من المنطق تفترق عن الرئيسية.
   لا قسم «شركات مميزة» هنا: هذا الدليل الكامل، والعرض المميز
   وظيفة الصفحة الرئيسية.
   ══════════════════════════════════════════════════════════════ */
body { margin:0; background:var(--bn-bg); color:var(--bn-ink);
  font:var(--bn-t-body); font-family:var(--bn-font); -webkit-font-smoothing:antialiased; }

.wrap { max-width:1080px; margin-inline:auto; padding-inline:var(--bn-s5); }
@media(max-width:560px){ .wrap { padding-inline:var(--bn-s4); } }

/* ── ترويسة الصفحة ── */
.head { padding-block:var(--bn-s10) var(--bn-s6); text-align:center; }
.head h1 { font:var(--bn-t-h1); margin:0 0 var(--bn-s3); letter-spacing:-.01em; }
.head p { font-size:14.5px; color:var(--bn-ink-2); margin:0 auto var(--bn-s6);
  max-width:52ch; line-height:1.8; }
.head-search { display:flex; gap:var(--bn-s2); max-width:520px; margin-inline:auto; }
.head-search .bn-input { flex:1; border-radius:var(--bn-r-pill);
  padding-inline:var(--bn-s4); min-height:48px; }
.head-search .bn-btn { border-radius:var(--bn-r-pill); flex:none; min-height:48px; }
@media(max-width:560px){ .head { padding-block:var(--bn-s8) var(--bn-s5); } }

/* ── صف النتائج ── */
.res { display:flex; align-items:center; justify-content:space-between;
  gap:var(--bn-s4); margin-block-end:var(--bn-s4); }
.res-n { font:var(--bn-t-sm); color:var(--bn-ink-3); }
.res-clear { display:inline-flex; align-items:center; gap:6px; min-height:44px;
  padding-inline:var(--bn-s3); border:0; background:0; cursor:pointer;
  color:var(--bn-ac); font:var(--bn-t-sm); font-family:var(--bn-font); }
.res-clear:hover { text-decoration:underline; }
.res-clear[hidden] { display:none; }

/* ── تحميل المزيد ── */
.more { text-align:center; margin-block-start:var(--bn-s6); }
.more[hidden] { display:none; }
.more-n { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:var(--bn-s3); }

/* ── التذييل ── */
.foot { border-block-start:1px solid var(--bn-line-soft);
  padding-block:var(--bn-s8) var(--bn-s14); margin-block-start:var(--bn-s14); }
.foot-grid { display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:var(--bn-s8); }
@media(max-width:700px){ .foot-grid { grid-template-columns:1fr 1fr; gap:var(--bn-s6); } }
.foot-logo { font:700 19px/1 var(--bn-font); margin-block-end:var(--bn-s3); }
.foot-logo b { color:var(--bn-ac); }
.foot p { font:var(--bn-t-sm); color:var(--bn-ink-3); margin:0; max-width:34ch; }
.foot h4 { font:var(--bn-t-cap); color:var(--bn-ink-3); letter-spacing:.05em;
  margin:0 0 var(--bn-s2); }
.foot a { display:flex; align-items:center; min-height:44px; font:var(--bn-t-sm);
  color:var(--bn-ink-2); text-decoration:none; }
.foot a:hover { color:var(--bn-ac); }
.foot-base { margin-block-start:var(--bn-s6); padding-block-start:var(--bn-s4);
  border-block-start:1px solid var(--bn-line-soft);
  font:var(--bn-t-cap); color:var(--bn-ink-3); text-align:center; }
</style>
</head>
<body class="bn-body">

<div class="bn-backdrop" aria-hidden="true"></div>
<div id="bn-nav"></div>

<header class="head wrap">
  <h1>دليل شركات المقاولات</h1>
  <p>كل الشركات المعتمدة في بُنيان — فلترها بالمدينة والتخصص، وتواصل مباشرة.</p>
  <form class="head-search" onsubmit="event.preventDefault();doSearch(this.q.value)">
    <label class="bn-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input name="q" id="searchBox" type="search" placeholder="ابحث عن شركة أو تخصص أو مدينة" aria-label="بحث">
    </label>
    <button class="bn-btn" type="submit">بحث</button>
  </form>
</header>

<!-- الفلاتر — من الوحدة المشتركة -->
<div class="bnf-bar"><div class="wrap" id="bnfMount"></div></div>

<main class="wrap">
  <div class="res">
    <span class="res-n" id="resultCount"></span>
    <button class="res-clear" type="button" id="clearBtn" hidden onclick="BNF.clear()">إزالة الفلاتر</button>
  </div>

  <div id="list">
    <div class="bnf-skelrow" style="margin-block-end:8px"></div>
    <div class="bnf-skelrow" style="margin-block-end:8px"></div>
    <div class="bnf-skelrow"></div>
  </div>

  <div class="more" id="moreWrap" hidden>
    <button class="bn-btn bn-btn-ghost" type="button" id="moreBtn">تحميل المزيد</button>
    <div class="more-n" id="moreInfo"></div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo">بُ<b>نيان</b></div>
        <p>منصة المقاولات الذكية في العراق — نربط أصحاب المشاريع بشركات البناء الموثوقة.</p>
      </div>
      <div>
        <h4>الخدمات</h4>
        <a href="index.html">الرئيسية</a>
        <a href="projects.html">سوق المشاريع</a>
      </div>
      <div>
        <h4>الحساب</h4>
        <a href="login.html">تسجيل الدخول</a>
      </div>
      <div>
        <h4>قانوني</h4>
        <a href="privacy.html">سياسة الخصوصية</a>
        <a href="terms.html">شروط الاستخدام</a>
      </div>
    </div>
    <div class="foot-base">بُنيان — صُنع في العراق</div>
  </div>
</footer>

<script src="bn-filters.js"></script>
<script src="nav-public.js"></script>
<script>
(function () {
'use strict';

const $ = (id) => document.getElementById(id);

/* الفلاتر والصفوف والحالات — الوحدة المشتركة نفسها التي تستعملها
   الرئيسية. أي إصلاح فيها يصل الصفحتين معاً. */
const BNF = BunyanFilters.create({
  perPage: 12,          /* أصغر من الرئيسية — هنا ترقيم بزر تحميل المزيد */
  onResults(r) {
    /* العدّاد من total الذي يحسبه الخادم بشرط الفلتر نفسه */
    $('resultCount').textContent = r.error ? ''
      : (r.hasFilters ? r.total + ' نتيجة' : r.total + ' شركة');
    $('clearBtn').hidden = !r.hasFilters || r.error;

    BNF.renderInto($('list'));

    /* تحميل المزيد — يظهر فقط حين تبقّى صفحات */
    $('moreWrap').hidden = !r.hasMore;
    if (r.hasMore) {
      $('moreInfo').textContent = 'عُرض ' + r.items.length + ' من ' + r.total;
    }

    /* حافظ على قيمة البحث في الحقل بعد الرجوع أو المشاركة */
    const box = $('searchBox');
    if (box && box.value !== r.state.q) box.value = r.state.q;
  }
});

$('moreBtn').onclick = async function () {
  this.disabled = true;
  const label = this.textContent;
  this.textContent = 'جارٍ التحميل...';
  await BNF.loadMore();
  this.disabled = false;
  this.textContent = label;
};

function doSearch(v) { BNF.setSearch(v); }

window.BNF = BNF;
window.doSearch = doSearch;

BNF.init();

})();
</script>
<script src="sw-update.js"></script>
</body>
</html>
