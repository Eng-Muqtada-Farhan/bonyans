<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المشروع — بُنيان</title>
<meta name="description" id="metaDesc" content="مشروع مطروح للعروض على منصة بُنيان.">
<meta property="og:type" content="article">
<meta property="og:title" id="ogTitle" content="تفاصيل المشروع — بُنيان">
<meta property="og:description" id="ogDesc" content="مشروع مطروح للعروض على منصة بُنيان.">
<meta property="og:url" id="ogUrl" content="">
<link rel="canonical" id="canon" href="">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-bn-font
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<script>
  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<style>
/* ══════════════════════════════════════════════════════════════
   تفاصيل المشروع — صفحة بدورين.
     شركة معتمدة  ← تقدّم عرضاً، وترى عرضها هي وحده (حكم الخادم)
     صاحب المشروع ← يرى كل العروض مرتّبةً بالسعر ويختار واحداً
   لا نخترع ما لا يعطيه الخادم: أرقام تواصل صاحب المشروع لا تُعرض
   لعموم الزوّار وإن كانت الواجهة البرمجية ترجعها (§٥·٥ وحماية
   بيانات شخصية).
   ══════════════════════════════════════════════════════════════ */
body { margin:0; background:var(--bn-bg); color:var(--bn-ink);
  font:var(--bn-t-body); font-family:var(--bn-font); -webkit-font-smoothing:antialiased; }
.wrap { max-width:820px; margin-inline:auto; padding-inline:var(--bn-s5); }
@media(max-width:560px){ .wrap { padding-inline:var(--bn-s4); } }

.crumb { display:inline-flex; align-items:center; gap:6px; min-height:44px;
  color:var(--bn-ink-3); font:var(--bn-t-sm); text-decoration:none; }
.crumb:hover { color:var(--bn-ac); }

/* ── ترويسة المشروع ── */
.head { padding-block:var(--bn-s4) var(--bn-s6);
  border-block-end:1px solid var(--bn-line-soft); }
.head-top { display:flex; align-items:center; gap:var(--bn-s3);
  flex-wrap:wrap; margin-block-end:var(--bn-s3); }
.head h1 { font:var(--bn-t-h1); margin:0 0 var(--bn-s4); letter-spacing:-.01em; }
@media(max-width:560px){ .head h1 { font-size:22px; } }

/* الميزانية أبرز عنصر — كما في بطاقات السوق */
.bud { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  margin-block-end:var(--bn-s4); }
.bud-n { font:700 30px/1.15 var(--bn-mono); color:var(--bn-ac);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; direction:ltr; }
.bud-c { font:var(--bn-t-sm); color:var(--bn-ink-3); }
.bud-open { font:500 18px/1.3 var(--bn-font); color:var(--bn-ink-3); }
@media(max-width:560px){ .bud-n { font-size:24px; } }

.meta { display:flex; align-items:center; gap:var(--bn-s4); flex-wrap:wrap;
  font:var(--bn-t-sm); color:var(--bn-ink-2); }
.meta i { display:inline-flex; align-items:center; gap:5px; font-style:normal; }
.meta b { font-weight:500; color:var(--bn-ink); font-variant-numeric:tabular-nums; }

/* ── الأقسام ── */
.sec { padding-block:var(--bn-s8); border-block-end:1px solid var(--bn-line-soft); }
.sec:last-of-type { border-block-end:0; }
.sec-t { font:var(--bn-t-h3); margin:0 0 var(--bn-s4); display:flex;
  align-items:center; gap:9px; }
.sec-t::before { content:""; width:5px; height:5px; border-radius:50%;
  background:var(--bn-ac); flex:none; }
.sec-t .n { font:var(--bn-t-cap); color:var(--bn-ink-3); }
.desc { font-size:14.5px; color:var(--bn-ink-2); line-height:1.9; margin:0;
  max-width:65ch; white-space:pre-line; }

/* ── العروض ── */
.bids { display:flex; flex-direction:column; gap:var(--bn-s3); }
.bid { padding:var(--bn-s5); border-radius:var(--bn-r-lg); }
.bid-h { display:flex; align-items:flex-start; justify-content:space-between;
  gap:var(--bn-s4); flex-wrap:wrap; }
.bid-co { display:flex; align-items:center; gap:var(--bn-s3); min-width:0; }
.bid-av { width:40px; height:40px; border-radius:var(--bn-r); flex:none;
  display:grid; place-items:center; overflow:hidden;
  background:var(--bn-ac-bg); color:var(--bn-ac);
  border:1px solid var(--bn-ac-line); font:700 15px/1 var(--bn-font); }
.bid-av img { width:100%; height:100%; object-fit:cover; }
.bid-n { font:500 14.5px/1.4 var(--bn-font); }
/* الرابط هدف لمس كامل ٤٤ بكسل — اسم الشركة وتاريخها معاً */
.bid-n a { color:inherit; text-decoration:none; display:inline-flex;
  flex-direction:column; justify-content:center; gap:3px; min-height:44px; }
.bid-n a:hover { color:var(--bn-ac); }
.bid-n .bid-when { color:var(--bn-ink-3); }
.bid-when { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:3px; }
.bid-p { text-align:end; }
.bid-p-n { font:700 19px/1.2 var(--bn-mono); color:var(--bn-ac);
  font-variant-numeric:tabular-nums; direction:ltr; display:block; }
.bid-p-d { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:3px; }
.bid-m { font-size:13.5px; color:var(--bn-ink-2); line-height:1.8;
  margin:var(--bn-s3) 0 0; }
.bid-f { display:flex; align-items:center; justify-content:space-between;
  gap:var(--bn-s3); flex-wrap:wrap; margin-block-start:var(--bn-s4);
  padding-block-start:var(--bn-s3); border-block-start:1px solid var(--bn-line-soft); }
.bid.is-won { border-color:var(--bn-ac); }
.tag { display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
  border-radius:var(--bn-r-pill); font:var(--bn-t-cap); }
.tag-on  { background:var(--bn-ac-bg); color:var(--bn-ac); border:1px solid var(--bn-ac-line); }
.tag-off { background:transparent; color:var(--bn-ink-3); border:1px solid var(--bn-line); }
.tag-low { background:transparent; color:var(--bn-ac); border:1px dashed var(--bn-ac-line); }

/* ── نموذج العرض ── */
.panel { padding:var(--bn-s6) var(--bn-s5); border-radius:var(--bn-r-lg); }
.panel-t { font:600 15px/1.4 var(--bn-font); margin:0 0 var(--bn-s2); }
.panel-d { font:var(--bn-t-sm); color:var(--bn-ink-3); margin:0 0 var(--bn-s5);
  line-height:1.75; max-width:52ch; }
.fr { margin-block-end:var(--bn-s4); }
.fr label { display:block; font:var(--bn-t-cap); color:var(--bn-ink-3);
  margin-block-end:6px; }
.fr input, .fr textarea { width:100%; min-height:44px; padding:11px var(--bn-s4);
  border:1px solid var(--bn-line); border-radius:var(--bn-r);
  background:var(--bn-bg); color:var(--bn-ink); font:400 14px/1.5 var(--bn-font); }
.fr input:focus, .fr textarea:focus { outline:none; border-color:var(--bn-ac); }
.fr textarea { resize:vertical; min-height:80px; }
.f2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--bn-s3); }
@media(max-width:480px){ .f2 { grid-template-columns:1fr; } }
.msg { font:var(--bn-t-sm); border-radius:var(--bn-r); padding:11px var(--bn-s4);
  margin-block-end:var(--bn-s4); display:none;
  background:var(--bn-ac-bg); color:var(--bn-ac); border:1px solid var(--bn-ac-line); }
.msg.is-on { display:block; }

/* ── الحالات ── */
.empty { text-align:center; padding:var(--bn-s10) var(--bn-s5);
  border:1px dashed var(--bn-line); border-radius:var(--bn-r-lg); }
.empty svg { width:32px; height:32px; stroke:var(--bn-ink-3); fill:none;
  stroke-width:1.3; margin-block-end:var(--bn-s3); }
.empty-t { font:500 14px/1.5 var(--bn-font); color:var(--bn-ink-2); }
.empty-d { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:5px;
  max-width:44ch; margin-inline:auto; line-height:1.7; }
.state { text-align:center; padding:var(--bn-s18) var(--bn-s5); }
.state svg { width:38px; height:38px; stroke:var(--bn-ink-3); fill:none;
  stroke-width:1.3; margin-block-end:var(--bn-s3); }
.state-t { font:500 15px/1.5 var(--bn-font); color:var(--bn-ink-2); }
.state-d { font:var(--bn-t-sm); color:var(--bn-ink-3); margin-block-start:6px; }
.state .bn-btn { margin-block-start:var(--bn-s4); }
.skel { height:110px; border-radius:var(--bn-r-lg); background:var(--bn-glass-tint);
  border:1px solid var(--bn-line-soft); margin-block-end:var(--bn-s3); }

/* ── تواصل صاحب المشروع — لمن له حق فقط ── */
.report-row { display:flex; justify-content:flex-end;
  margin-block-start:var(--bn-s5); }
.contact { display:flex; gap:var(--bn-s2); flex-wrap:wrap; }
.contact a { display:inline-flex; align-items:center; justify-content:center;
  gap:7px; min-height:44px; padding-inline:var(--bn-s4);
  border:1px solid var(--bn-line); border-radius:var(--bn-r);
  color:var(--bn-ink-2); text-decoration:none; font:400 13.5px/1 var(--bn-font);
  flex:1 1 auto; min-width:150px;
  transition:color var(--bn-fast), border-color var(--bn-fast); }
.contact a:hover { color:var(--bn-ac); border-color:var(--bn-ac-line); }
</style>
</head>
<body class="bn-body">

<div class="bn-backdrop" aria-hidden="true"></div>
<div id="bn-nav"></div>

<main class="wrap" id="main">
  <div class="skel" style="margin-block-start:var(--bn-s6)"></div>
  <div class="skel"></div>
</main>

<footer class="bn-legal-foot">
  <a href="privacy.html">سياسة الخصوصية</a>
  <a href="terms.html">شروط الاستخدام</a>
</footer>

<script src="report.js"></script>
<script src="guard.js"></script>
<script src="bn-filters.js"></script>
<script src="nav.js"></script>
<script>
(function () {
'use strict';

const API = '';
const $   = (id) => document.getElementById(id);
const BF  = BunyanFilters;
const esc = BF.esc, svg = BF.svg, initials = BF.initials;

const IC = Object.assign({}, BF.icons, {
  back:  '<path d="M9 6l6 6-6 6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  gone:  '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  lock:  '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  phone: '<path d="M21 16.5v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 3.7 2 2 0 0 1 3.1 1.5h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L7.1 9.3a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/>',
  mail:  '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3"/><path d="M10 13v3h4v-3M8 20h8"/>'
});

const ID    = new URLSearchParams(location.search).get('id');
const ROLE  = (window.BunyanGuard && window.BunyanGuard.role()) || null;
const store = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
/* رمز واحد لكل الأدوار — الخادم يقرأ الدور من داخله */
const UTOK  = store('bn_token');
const CTOK  = UTOK;
const MYUID = parseInt(store('project_user_id') || '0', 10);

const PSTATUS = BF.projectStatus;
const fmt = (n) => Number(n).toLocaleString('en-US');
function when(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('ar-IQ', { year:'numeric', month:'long', day:'numeric' }); }
  catch (e) { return ''; }
}

/* ══ الجلب ══ */
async function api(path, opts) {
  const o = Object.assign({ signal: AbortSignal.timeout(12000) }, opts || {});
  return fetch(API + path, o);
}

function fail(kind) {
  $('main').innerHTML = kind === 'gone'
    ? '<div class="state">' + svg(IC.gone, 38) +
      '<div class="state-t">هذا المشروع غير متاح</div>' +
      '<div class="state-d">قد يكون أُزيل أو انتهى.</div>' +
      '<a class="bn-btn" href="projects.html">تصفّح السوق</a></div>'
    : '<div class="state">' + svg(IC.offline, 38) +
      '<div class="state-t">تعذّر الاتصال بالخادم</div>' +
      '<div class="state-d">تحقّق من اتصالك ثم أعد المحاولة.</div>' +
      '<button class="bn-btn" type="button" data-retry>إعادة المحاولة</button></div>';
  const r = document.querySelector('[data-retry]');
  if (r) r.onclick = () => location.reload();
}

function setMeta(p) {
  const bits = [p.category, p.city].filter(Boolean).join(' · ');
  const title = p.title + (bits ? ' — ' + bits : '') + ' | بُنيان';
  const desc  = (p.description && p.description.trim())
    ? p.description.trim().slice(0, 155)
    : p.title + (bits ? ' — ' + bits : '') + '. مشروع مطروح للعروض على بُنيان.';
  document.title = title;
  $('ogTitle').content = title;
  $('metaDesc').content = desc;
  $('ogDesc').content = desc;
  $('ogUrl').content = location.href;
  $('canon').href = location.href;
}

/* ══ الميزانية ══ */
function budgetHTML(p) {
  let t = null;
  if (p.budget_min != null && p.budget_max != null) t = fmt(p.budget_min) + ' – ' + fmt(p.budget_max);
  else if (p.budget_min != null) t = fmt(p.budget_min) + '+';
  else if (p.budget_max != null) t = '≤ ' + fmt(p.budget_max);
  return t === null
    ? '<div class="bud"><span class="bud-open">الميزانية غير محدَّدة</span></div>'
    : '<div class="bud"><span class="bud-n">' + esc(t) + '</span>' +
      '<span class="bud-c">دينار</span></div>';
}

/* ══ عرض واحد ══ */
function bidHTML(b, opts) {
  const av = b.company_image
    ? '<div class="bid-av"><img src="' + esc(b.company_image) + '" alt="" loading="lazy"></div>'
    : '<div class="bid-av">' + esc(initials(b.company_name)) + '</div>';
  const tags = [];
  if (b.status === 'accepted')      tags.push('<span class="tag tag-on">' + svg(IC.trophy, 11) + 'الشركة المختارة</span>');
  else if (b.status === 'rejected') tags.push('<span class="tag tag-off">لم يُختَر</span>');
  if (opts.lowest && b.status !== 'accepted') tags.push('<span class="tag tag-low">أقل سعر</span>');

  const act = opts.canSelect
    ? '<button class="bn-btn bn-btn-sm" type="button" data-pick="' + esc(b.id) + '">اختر هذه الشركة</button>'
    : '';

  return '<div class="bid bn-solid' + (b.status === 'accepted' ? ' is-won' : '') + '">' +
    '<div class="bid-h">' +
      '<div class="bid-co">' + av +
        '<div class="bid-n">' +
          (opts.link
            ? '<a href="company_profile.html?id=' + esc(b.company_id) + '">' +
                '<span>' + esc(b.company_name) + '</span>' +
                '<span class="bid-when">' + esc(when(b.created_at)) + '</span></a>'
            : '<span>' + esc(b.company_name) + '</span>' +
              '<div class="bid-when">' + esc(when(b.created_at)) + '</div>') +
        '</div>' +
      '</div>' +
      '<div class="bid-p"><span class="bid-p-n">' + esc(fmt(b.price)) + '</span>' +
        '<span class="bid-p-d">دينار' +
          (b.duration_days ? ' · ' + b.duration_days + ' يوماً' : '') + '</span></div>' +
    '</div>' +
    (b.message ? '<p class="bid-m">' + esc(b.message) + '</p>' : '') +
    (tags.length || act
      ? '<div class="bid-f"><div>' + tags.join(' ') + '</div>' + act + '</div>'
      : '') +
    '</div>';
}

/* ══ لوحة الدور ══ */
function panelHTML(p, bids, view) {
  /* صاحب المشروع — يرى كل العروض مرتّبةً بالسعر (ترتيب الخادم) */
  if (view === 'owner') {
    if (!bids.length) {
      return '<div class="empty">' + svg(IC.bid, 32) +
        '<div class="empty-t">لم تصل عروض بعد</div>' +
        '<div class="empty-d">حين تقدّم الشركات عروضها ستظهر هنا مرتّبةً من الأقل سعراً.</div></div>';
    }
    const done = p.status === 'contracted';
    const minP = Math.min.apply(null, bids.map(b => Number(b.price)));
    return '<div class="bids">' + bids.map(b => bidHTML(b, {
      link: true, canSelect: !done, lowest: Number(b.price) === minP
    })).join('') + '</div>' +
    (done ? '' : '<p class="panel-d" style="margin-block-start:var(--bn-s4)">' +
      'اختيار شركة يُغلق المشروع للعروض ويُعلم بقيّة الشركات.</p>');
  }

  /* شركة — الخادم يعيد لها عرضها هي وحده */
  if (view === 'company') {
    if (bids.length) {
      return '<div class="bids">' + bids.map(b => bidHTML(b, { link:false, canSelect:false })).join('') + '</div>' +
        '<p class="panel-d" style="margin-block-start:var(--bn-s4)">' +
        'هذا عرضك أنت. عروض الشركات الأخرى لا تظهر لك.</p>';
    }
    if (p.status !== 'published') {
      return '<div class="empty">' + svg(IC.lock, 32) +
        '<div class="empty-t">هذا المشروع لم يعد يستقبل عروضاً</div>' +
        '<div class="empty-d">اختار صاحبه شركةً بالفعل.</div></div>';
    }
    return '<div class="panel bn-solid">' +
      '<h3 class="panel-t">قدّم عرضك</h3>' +
      '<p class="panel-d">عرض واحد لكل مشروع. صاحب المشروع يرى السعر والمدة والرسالة.</p>' +
      '<div class="msg" id="bidMsg"></div>' +
      '<form id="bidForm">' +
        '<div class="f2">' +
          '<div class="fr"><label for="bPrice">السعر (دينار) *</label>' +
            '<input id="bPrice" type="number" min="1" step="1000" required dir="ltr" inputmode="numeric"></div>' +
          '<div class="fr"><label for="bDays">المدة (يوماً)</label>' +
            '<input id="bDays" type="number" min="1" step="1" dir="ltr" inputmode="numeric"></div>' +
        '</div>' +
        '<div class="fr"><label for="bMsg">رسالة لصاحب المشروع</label>' +
          '<textarea id="bMsg" maxlength="1000" placeholder="ما يميّز عرضك — الخبرة، المواد، الضمان"></textarea></div>' +
        '<button class="bn-btn" type="submit" id="bidBtn">إرسال العرض</button>' +
      '</form></div>';
  }

  /* زائر بلا جلسة، أو دور لا يعنيه هذا المشروع */
  if (p.status !== 'published') {
    return '<div class="empty">' + svg(IC.lock, 32) +
      '<div class="empty-t">هذا المشروع لم يعد يستقبل عروضاً</div>' +
      '<div class="empty-d">اختار صاحبه شركةً بالفعل.</div></div>';
  }
  if (ROLE === 'user') {
    return '<div class="empty">' + svg(IC.lock, 32) +
      '<div class="empty-t">العروض لصاحب المشروع وحده</div>' +
      '<div class="empty-d">هذا ليس مشروعك، فلا تظهر لك عروضه.</div></div>';
  }
  if (ROLE === 'admin') {
    return '<div class="empty">' + svg(IC.lock, 32) +
      '<div class="empty-t">حساب إدارة</div>' +
      '<div class="empty-d">تقديم العروض للشركات المعتمدة.</div></div>';
  }
  const back = location.pathname + location.search;
  return '<div class="panel bn-solid">' +
    '<h3 class="panel-t">هل تريد تقديم عرض؟</h3>' +
    '<p class="panel-d">تقديم العروض متاح لشركات المقاولات المعتمدة في بُنيان.</p>' +
    '<a class="bn-btn" href="login.html?role=company&next=' + encodeURIComponent(back) + '">دخول الشركات</a></div>';
}

/* ══ تواصل صاحب المشروع — لصاحبه أو للشركة المختارة فقط ══ */
function contactHTML(p, bids, view) {
  const won = view === 'company' && bids.some(b => b.status === 'accepted');
  if (view !== 'owner' && !won) return '';
  const acts = [];
  if (p.contact_phone) {
    const d = String(p.contact_phone).replace(/[^\d]/g, '');
    if (d.length >= 7) acts.push('<a href="tel:' + esc(d) + '">' + svg(IC.phone, 15) + esc(p.contact_phone) + '</a>');
  }
  if (p.contact_email) acts.push('<a href="mailto:' + esc(p.contact_email) + '">' + svg(IC.mail, 15) + esc(p.contact_email) + '</a>');
  if (!acts.length) return '';
  return '<section class="sec"><h2 class="sec-t">تواصل' +
    (p.contact_name ? ' — ' + esc(p.contact_name) : '') + '</h2>' +
    '<div class="contact">' + acts.join('') + '</div></section>';
}

/* ══ الرسم ══ */
function render(p, bids, view) {
  setMeta(p);
  const open = p.status === 'published';

  $('main').innerHTML =
    '<a class="crumb" href="projects.html">' + svg(IC.back, 14) + ' سوق المشاريع</a>' +

    '<header class="head">' +
      '<div class="head-top">' +
        '<span class="tag ' + (open ? 'tag-on' : 'tag-off') + '">' +
          esc(PSTATUS[p.status] || p.status) + '</span>' +
        '<span class="meta"><i>' + svg(IC.bid, 13) + '<b>' + p.bids_count + '</b> ' +
          (p.bids_count === 1 ? 'عرض' : 'عروض') + '</i></span>' +
      '</div>' +
      '<h1>' + esc(p.title) + '</h1>' +
      budgetHTML(p) +
      '<div class="meta">' +
        (p.city ? '<i>' + svg(IC.pin, 13) + esc(p.city) + '</i>' : '') +
        (p.category ? '<i>' + svg(IC.tag, 13) + esc(p.category) + '</i>' : '') +
        (p.created_at ? '<i>' + svg(IC.clock, 13) + esc(when(p.created_at)) + '</i>' : '') +
      '</div>' +
    '</header>' +

    (p.description && p.description.trim()
      ? '<section class="sec"><h2 class="sec-t">وصف المشروع</h2>' +
        '<p class="desc">' + esc(p.description) + '</p></section>'
      : '') +

    '<section class="sec"><h2 class="sec-t">' +
      (view === 'owner' ? 'العروض الواردة' : 'العروض') +
      (view === 'owner' && bids.length ? ' <span class="n">(' + bids.length + ')</span>' : '') +
      '</h2>' + panelHTML(p, bids, view) + '</section>' +

    contactHTML(p, bids, view) +

    /* الإبلاغ عن المشروع — شرط Apple ١٫٢ */
    '<div class="report-row">' + BunyanReport.button('project', p.id, 'إبلاغ عن هذا المشروع') + '</div>';

  BunyanReport.wire($('main'));
  wire(p);
}

function wire(p) {
  /* اختيار شركة — صاحب المشروع */
  document.querySelectorAll('[data-pick]').forEach(btn => {
    btn.onclick = async function () {
      const label = this.textContent;
      this.disabled = true; this.textContent = 'جارٍ...';
      try {
        const r = await api('/projects/' + encodeURIComponent(p.id) + '/select-company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + UTOK },
          body: JSON.stringify({ bid_id: Number(this.dataset.pick) })
        });
        if (r.ok) { load(); return; }
        this.disabled = false; this.textContent = label;
        alert(r.status === 403 ? 'اختيار الشركة لصاحب المشروع وحده.'
            : r.status === 400 ? 'اختيرت شركة لهذا المشروع بالفعل.'
            : 'تعذّر إتمام الاختيار — أعد المحاولة.');
      } catch (e) {
        this.disabled = false; this.textContent = label;
        alert('تعذّر الاتصال بالخادم — أعد المحاولة.');
      }
    };
  });

  /* تقديم عرض — الشركة */
  const form = $('bidForm');
  if (!form) return;
  form.onsubmit = async function (e) {
    e.preventDefault();
    const btn = $('bidBtn'), msg = $('bidMsg');
    const show = (t) => { msg.textContent = t; msg.classList.add('is-on'); };
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
    try {
      const r = await api('/projects/' + encodeURIComponent(p.id) + '/bid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + CTOK },
        body: JSON.stringify({
          price: Number($('bPrice').value),
          duration_days: $('bDays').value ? Number($('bDays').value) : null,
          message: $('bMsg').value.trim() || ''
        })
      });
      if (r.ok) { load(); return; }
      let d = {};
      try { d = await r.json(); } catch (err) {}
      show(r.status === 401 ? 'انتهت جلستك — سجّل الدخول مجدداً.'
         : r.status === 409 ? 'قدّمت عرضاً على هذا المشروع بالفعل.'
         : r.status === 429 ? 'محاولات كثيرة — انتظر قبل المحاولة مجدداً.'
         : r.status === 403 ? (d.detail || 'حسابك لا يسمح بتقديم عرض على هذا المشروع.')
         : r.status === 400 ? (d.detail || 'لا يمكن تقديم عرض على هذا المشروع.')
         : 'تعذّر الاتصال بالخادم — أعد المحاولة.');
    } catch (err) {
      show('تعذّر الاتصال بالخادم — أعد المحاولة.');
    } finally {
      btn.disabled = false; btn.textContent = 'إرسال العرض';
    }
  };
}

/* ══ التحميل ══
   الدور يُحسم من مالك المشروع لا من التخزين وحده: من يملك رمز
   مستخدم قد يكون صاحب هذا المشروع أو لا. والخادم هو الحَكَم —
   /projects/{id}/bids يعيد كل العروض للمالك، وعرضاً واحداً
   للشركة، و401 لمن لا رمز له. */
async function load() {
  if (!ID) { fail('gone'); return; }
  try {
    const r = await api('/projects/' + encodeURIComponent(ID));
    if (r.status === 404) { fail('gone'); return; }
    if (!r.ok) { fail('net'); return; }
    const p = await r.json();

    const isOwner = ROLE === 'user' && MYUID && p.owner_user_id === MYUID;
    const view = isOwner ? 'owner' : (ROLE === 'company' ? 'company' : 'guest');

    /* العروض ثانوية: فشلها لا يمنع عرض المشروع */
    let bids = [];
    if (view !== 'guest') {
      try {
        const rb = await api('/projects/' + encodeURIComponent(ID) + '/bids', {
          headers: { Authorization: 'Bearer ' + (view === 'owner' ? UTOK : CTOK) }
        });
        if (rb.ok) bids = await rb.json();
      } catch (e) {}
    }
    render(p, bids, view);
  } catch (e) { fail('net'); }
}
load();

})();
</script>
<script src="sw-update.js"></script>
</body>
</html>
