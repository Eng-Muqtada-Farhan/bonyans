<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — بُنيان</title>
<meta name="robots" content="noindex, nofollow">
<!-- ══════════════════════════════════════════════════════════════
     صفحة تحويل.

     كانت هذه لوحة الإدارة الأحادية (٨٩٩ سطراً · ٤٧ إيموجي).
     فُكِّكت في الجولة ٤ إلى ست شاشات في /admin. لم تُحذف الصفحة
     لأن الروابط المحفوظة والإشارات المرجعية تكسر بحذفها — نفس
     قرار company_dashboard.html.

     كانت آخر ملفّ يربط bunyan.css، فحذفُه صار ممكناً بعد هذا.
     ══════════════════════════════════════════════════════════════ -->
<meta http-equiv="refresh" content="0; url=admin/index.html">
<link rel="canonical" href="admin/index.html">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="tokens.css">
<script>
  (function () {
    var t = localStorage.getItem('bn-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    location.replace('admin/index.html' + location.hash);
  })();
</script>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bn-bg); color:var(--bn-ink);
    font:var(--bn-t-body); font-family:var(--bn-font); }
  .rd { text-align:center; padding:var(--bn-s8) var(--bn-s5); max-width:44ch; }
  .rd h1 { font:var(--bn-t-h3); margin:0 0 var(--bn-s3); }
  .rd p { font:var(--bn-t-sm); color:var(--bn-ink-3); margin:0 0 var(--bn-s5);
    line-height:1.8; }
</style>
</head>
<body class="bn-body">
  <div class="rd">
    <h1>انتقلت لوحة الإدارة</h1>
    <p>صار لكل قسم شاشته الخاصة. سنأخذك إلى اللوحة الجديدة الآن.</p>
    <a class="bn-btn" href="admin/index.html">الذهاب إلى اللوحة</a>
  </div>
</body>
</html>
