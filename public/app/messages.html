<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرسائل — بُنيان</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../tokens.css">
<script>
  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<script src="../guard.js" data-require="company"></script>
<style>
.ms-wrap { display:grid; grid-template-columns:280px 1fr; gap:var(--bn-s4);
  min-height:60vh; }
@media(max-width:760px){ .ms-wrap { grid-template-columns:1fr; } }

.ms-list { display:flex; flex-direction:column; gap:6px; }
.ms-conv { display:flex; align-items:center; gap:var(--bn-s3); padding:var(--bn-s3);
  border-radius:var(--bn-r); border:1px solid transparent; background:transparent;
  cursor:pointer; text-align:start; min-height:44px; width:100%;
  color:var(--bn-ink-2); font-family:var(--bn-font);
  transition:background var(--bn-fast), border-color var(--bn-fast); }
.ms-conv:hover { background:var(--bn-glass-tint); }
.ms-conv.is-on { border-color:var(--bn-ac-line); background:var(--bn-ac-bg); color:var(--bn-ac); }
.ms-av { width:36px; height:36px; border-radius:var(--bn-r-sm); flex:none;
  display:grid; place-items:center; background:var(--bn-ac-bg); color:var(--bn-ac);
  border:1px solid var(--bn-ac-line); font:600 13px/1 var(--bn-font); }
.ms-conv-b { flex:1; min-width:0; }
.ms-conv-n { font:500 13.5px/1.4 var(--bn-font);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ms-conv-d { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:2px; }
.ms-unread { flex:none; min-width:22px; height:22px; padding-inline:6px;
  border-radius:999px; background:var(--bn-ac); color:var(--bn-ac-on);
  font:600 11px/22px var(--bn-mono); text-align:center; }

.ms-thread { display:flex; flex-direction:column; border:1px solid var(--bn-line-soft);
  border-radius:var(--bn-r-lg); overflow:hidden; min-height:420px; }
.ms-head { padding:var(--bn-s4); border-block-end:1px solid var(--bn-line-soft);
  font:500 14.5px/1.4 var(--bn-font); display:flex; align-items:center; gap:var(--bn-s3); }
.ms-body { flex:1; overflow-y:auto; padding:var(--bn-s4);
  display:flex; flex-direction:column; gap:var(--bn-s3); max-height:52vh; }
.ms-b { max-width:78%; padding:10px var(--bn-s4); border-radius:var(--bn-r-lg);
  font-size:13.5px; line-height:1.75; }
.ms-b-in { align-self:flex-start; background:var(--bn-glass-tint);
  border:1px solid var(--bn-line-soft); }
.ms-b-out { align-self:flex-end; background:var(--bn-ac-bg); color:var(--bn-ink);
  border:1px solid var(--bn-ac-line); }
.ms-b-t { font:var(--bn-t-cap); color:var(--bn-ink-3); margin-block-start:5px; }
.ms-foot { display:flex; gap:var(--bn-s2); padding:var(--bn-s3);
  border-block-start:1px solid var(--bn-line-soft); }
.ms-foot input { flex:1; min-height:44px; padding:11px var(--bn-s4);
  border:1px solid var(--bn-line); border-radius:var(--bn-r);
  background:var(--bn-bg); color:var(--bn-ink); font:400 14px/1.5 var(--bn-font); }
.ms-foot input:focus { outline:none; border-color:var(--bn-ac); }
.ms-send { width:44px; height:44px; flex:none; display:grid; place-items:center;
  border:0; border-radius:var(--bn-r); background:var(--bn-ac); color:var(--bn-ac-on);
  cursor:pointer; }
.ms-send:disabled { opacity:.5; cursor:not-allowed; }
.ms-block { margin-inline-start:auto; }
.ms-b-t { display:flex; align-items:center; gap:6px; }
</style>
</head>
<body class="bn-body">

<div class="bn-backdrop" aria-hidden="true"></div>

<main class="ac-wrap" id="main">
  <div class="ac-head">
    <h1>الرسائل</h1>
    <p>محادثاتك مع أصحاب المشاريع. المحادثة يبدأها العميل من صفحتك العامّة.</p>
  </div>
  <div id="body"></div>
</main>

<script src="app-core.js"></script>
<script src="../nav.js"></script>
<script src="../report.js"></script>
<script>
(function () {
'use strict';
const AC = window.AppCore;
const $ = (id) => document.getElementById(id);
const esc = AC.esc, svg = AC.svg, I = AC.icons, when = AC.when;

let CONVS = [], CURRENT = null, BLOCKED = new Set();

async function refreshBlocked() {
  try {
    const rows = await AC.api('/blocks');
    BLOCKED = new Set(rows.map(r => r.user_id));
  } catch (e) { /* لا نمنع فتح المحادثات إن تعذّر جلب قائمة الحجب */ }
}

$('body').innerHTML = AC.skeleton(3, 66);

function renderShell() {
  $('body').innerHTML =
    '<div class="ms-wrap">' +
      '<div class="ms-list" id="convs"></div>' +
      '<div id="thread"></div>' +
    '</div>';
  renderConvs();
}

function renderConvs() {
  $('convs').innerHTML = CONVS.map(c =>
    '<button class="ms-conv' + (CURRENT === c.id ? ' is-on' : '') +
      '" type="button" data-c="' + esc(c.id) + '">' +
      '<span class="ms-av">' + esc(AC.initials(c.client_name || 'ع')) + '</span>' +
      '<span class="ms-conv-b">' +
        '<span class="ms-conv-n">' + esc(c.client_name || 'عميل') + '</span>' +
        '<span class="ms-conv-d">' + esc(when(c.created_at, {month:'short', day:'numeric'})) + '</span>' +
      '</span>' +
      (c.unread ? '<span class="ms-unread">' + c.unread + '</span>' : '') +
    '</button>').join('');
  $('convs').querySelectorAll('[data-c]').forEach(b => {
    b.onclick = () => open(Number(b.dataset.c));
  });
}

function threadEmpty() {
  $('thread').innerHTML = AC.emptyState('اختر محادثة',
    'اختر محادثة من القائمة لقراءتها والردّ عليها.', '', I.chat);
}

async function open(id) {
  CURRENT = id;
  renderConvs();
  $('thread').innerHTML = '<div class="ms-thread"><div class="ms-body">' +
    AC.skeleton(3, 44) + '</div></div>';
  try {
    const page = await AC.api('/conversations/' + id + '/messages');
    /* تعليم مقروءة صار طلباً منفصلاً (GET صار قراءة صرفة — توحيد
       المصادقة). لا ننتظره: فشله لا يمنع عرض المحادثة. */
    AC.api('/conversations/' + id + '/mark-read', { method: 'POST' }).catch(() => {});
    let oldestId = page.oldest_id, hasMore = page.has_more;
    const conv = CONVS.find(c => c.id === id) || {};
    const peer = conv.peer_user_id;
    const isBlocked = peer != null && BLOCKED.has(peer);

    function bubble(m) {
      return '<div class="ms-b ' + (m.sender_type === 'client' ? 'ms-b-in' : 'ms-b-out') + '">' +
        esc(m.message) +
        '<div class="ms-b-t"><span>' + esc(when(m.created_at,
          {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})) + '</span>' +
          (m.sender_type === 'client' && window.BunyanReport
            ? window.BunyanReport.button('message', m.id, '') : '') +
        '</div>' +
      '</div>';
    }
    function olderBtn() {
      return hasMore
        ? '<button class="bn-btn bn-btn-ghost bn-btn-sm" type="button" id="olderBtn" ' +
            'style="align-self:center;margin-block-end:8px">تحميل رسائل أقدم</button>'
        : '';
    }

    $('thread').innerHTML =
      '<div class="ms-thread">' +
        '<div class="ms-head"><span class="ms-av">' +
          esc(AC.initials(conv.client_name || 'ع')) + '</span>' +
          esc(conv.client_name || 'عميل') +
          (peer != null
            ? '<button class="bn-btn bn-btn-ghost bn-btn-sm ms-block" type="button" id="blockBtn">' +
                (isBlocked ? 'إلغاء الحجب' : 'حجب') + '</button>'
            : '') +
        '</div>' +
        '<div class="ms-body" id="msgs">' +
          olderBtn() +
          (page.items.length
            ? page.items.map(bubble).join('')
            : '<div class="ac-state"><div class="ac-state-t">لا رسائل في هذه المحادثة</div></div>') +
        '</div>' +
        '<form class="ms-foot" id="sendForm">' +
          '<input id="msgInput" maxlength="2000" placeholder="اكتب ردّك" aria-label="نص الرسالة">' +
          '<button class="ms-send" type="submit" id="sendBtn" aria-label="إرسال">' +
            svg(I.send, 18) + '</button>' +
        '</form>' +
      '</div>';

    const box = $('msgs');
    box.scrollTop = box.scrollHeight;
    if (window.BunyanReport) window.BunyanReport.wire($('msgs'));

    function wireOlderBtn() {
      const btn = $('olderBtn');
      if (!btn) return;
      btn.onclick = async function () {
        btn.disabled = true;
        btn.textContent = 'جارٍ التحميل...';
        try {
          const older = await AC.api('/conversations/' + id + '/messages?before_id=' + oldestId);
          oldestId = older.oldest_id;
          hasMore = older.has_more;
          const prevHeight = box.scrollHeight;
          btn.outerHTML = olderBtn() + older.items.map(bubble).join('');
          box.scrollTop = box.scrollHeight - prevHeight;
          if (window.BunyanReport) window.BunyanReport.wire(box);
          wireOlderBtn();
        } catch (err) {
          AC.toast(AC.errText(err), 'err');
          btn.disabled = false;
          btn.textContent = 'تحميل رسائل أقدم';
        }
      };
    }
    wireOlderBtn();

    if (peer != null) {
      $('blockBtn').onclick = async function () {
        const btn = this;
        btn.disabled = true;
        try {
          if (isBlocked) {
            await AC.api('/block/' + peer, { method: 'DELETE' });
          } else {
            await AC.api('/block/' + peer, { method: 'POST' });
          }
          await refreshBlocked();
          await open(id);
        } catch (err) {
          AC.toast(AC.errText(err), 'err');
          btn.disabled = false;
        }
      };
    }

    /* القراءة تُعلَّم على الخادم عند جلب الرسائل، فالعدّاد يصفَّر هنا */
    const c = CONVS.find(x => x.id === id);
    if (c) { c.unread = 0; renderConvs(); }

    $('sendForm').onsubmit = async function (e) {
      e.preventDefault();
      const inp = $('msgInput'), btn = $('sendBtn');
      const text = inp.value.trim();
      if (!text) return;
      btn.disabled = true;
      try {
        await AC.api('/conversations/' + id + '/messages', {
          method: 'POST', body: { message: text }
        });
        inp.value = '';
        await open(id);
      } catch (err) {
        AC.toast(AC.errText(err), 'err');
      } finally { btn.disabled = false; }
    };
  } catch (e) {
    $('thread').innerHTML = AC.errorState(AC.errText(e));
    AC.onRetry($('thread'), () => open(id));
  }
}

async function load() {
  try {
    await refreshBlocked();
    CONVS = await AC.api('/conversations');
    if (!CONVS.length) {
      $('body').className = '';
      $('body').innerHTML = AC.emptyState('لا محادثات بعد',
        'حين يراسلك عميل من صفحتك العامّة ستظهر المحادثة هنا.', '', I.chat);
      return;
    }
    renderShell();
    threadEmpty();
  } catch (e) {
    $('body').className = '';
    $('body').innerHTML = AC.errorState(AC.errText(e));
    AC.onRetry($('body'), load);
  }
}
load();
})();
</script>
</body>
</html>
