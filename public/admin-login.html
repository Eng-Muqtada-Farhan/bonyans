<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة — بُنيان</title>
<!-- لا فهرسة، ولا رابط إليها من أي صفحة عامة — الباب الذي لا يُعلَن
     عنه لا يُطرَق. الوصول الوحيد: حارس الأسطح يحوّل زائر /admin/
     غير المصادَق إلى هنا مباشرة. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="بُنيان">
<link rel="stylesheet" href="tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" data-bn-font
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap">
<script>
  (function(){ var t=localStorage.getItem('bn-theme')||'light';
    document.documentElement.setAttribute('data-theme',t); })();
</script>
<style>
body{
  margin:0; min-height:100dvh; background:var(--bn-bg); color:var(--bn-ink);
  font:var(--bn-t-body); font-family:var(--bn-font);
  display:grid; place-items:center; padding:var(--bn-s6) var(--bn-s4);
  -webkit-font-smoothing:antialiased;
}
.ad-panel{width:100%; max-width:380px; border-radius:var(--bn-r-xl);
  padding:var(--bn-s8) var(--bn-s6); box-shadow:var(--bn-sh-3)}
.ad-head{text-align:center; margin-block-end:var(--bn-s6)}
.ad-h1{font:var(--bn-t-h1); margin:0 0 var(--bn-s2); letter-spacing:-.01em}
.ad-sub{font:var(--bn-t-sm); color:var(--bn-ink-2); margin:0}
.ad-msg{display:none; font:var(--bn-t-sm); border-radius:var(--bn-r);
  padding:11px var(--bn-s4); margin-block-end:var(--bn-s4); line-height:1.6}
.ad-msg.is-on{display:block; background:var(--bn-err-bg); color:var(--bn-err);
  border:1px solid var(--bn-err-line)}
.ad-actions{margin-block-start:var(--bn-s5)}
</style>
</head>
<body>

<div class="bn-backdrop" aria-hidden="true"></div>

<main class="ad-panel bn-glass">
  <div class="ad-head">
    <h1 class="ad-h1">دخول الإدارة</h1>
    <p class="ad-sub">هذه اللوحة لفريق بُنيان وحده.</p>
  </div>

  <div class="ad-msg" id="adMsg" role="alert" aria-live="polite"></div>

  <form id="adForm" novalidate>
    <div class="bn-field">
      <label for="adUser">اسم المستخدم</label>
      <div class="bn-input">
        <input id="adUser" type="text" autocomplete="username" required>
      </div>
    </div>

    <div class="bn-field">
      <label for="adPass">كلمة المرور</label>
      <div class="bn-input">
        <input id="adPass" type="password" autocomplete="current-password" required>
      </div>
    </div>

    <div class="ad-actions">
      <button class="bn-btn bn-btn-block" type="submit" id="adSubmit">دخول</button>
    </div>
  </form>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function msg(text) {
    var m = $('adMsg');
    m.className = 'ad-msg is-on';
    m.textContent = text;
  }

  $('adForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = $('adUser').value.trim();
    var password = $('adPass').value;
    if (!username || !password) { msg('أدخل اسم المستخدم وكلمة المرور.'); return; }

    var btn = $('adSubmit');
    btn.disabled = true;
    btn.textContent = 'جارٍ التحقّق...';

    try {
      var res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });

      if (res.status === 401) { msg('اسم المستخدم أو كلمة المرور غير صحيحة.'); return; }
      if (res.status === 429) { msg('محاولات كثيرة — انتظر ١٠ دقائق قبل المحاولة مجدداً.'); return; }
      if (res.status >= 500)  { msg('تعذّر الاتصال بالخادم — أعد المحاولة.'); return; }
      if (!res.ok)            { msg('تعذّر الدخول (رمز ' + res.status + ').'); return; }

      var d = await res.json();
      if (!d.token) { msg('استجابة غير متوقّعة من الخادم.'); return; }

      /* الكعكة يضعها الخادم في الاستجابة نفسها — HttpOnly، لا تلمسها
         الصفحة. حارس الأسطح (صفحات /admin) يقرؤها عند التنقّل.
         لكن admin-core.js نفسه يصادق نداءات API بترويسة
         Authorization لا بالكعكة (نفس نمط login.html لدوري
         company/user) — بلا هذا السطر تنجح صفحة /admin/index.html
         بالتنقّل ثم تفشل كل بياناتها فوراً بـ401 صامت، فيُعاد
         المستخدم إلى login.html العامة ظنّاً منه أنه لم يدخل قط. */
      localStorage.setItem('bn_token', d.token);
      var next = new URLSearchParams(location.search).get('next');
      location.replace(next && next.charAt(0) === '/' && next.indexOf('//') !== 0
        ? next : '/admin/index.html');
    } catch (err) {
      msg('تعذّر الاتصال بالخادم — أعد المحاولة.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'دخول';
    }
  });
})();
</script>
</body>
</html>
