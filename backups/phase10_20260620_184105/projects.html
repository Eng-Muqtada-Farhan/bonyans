<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق المشاريع — بُنيان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c8a96e; --gold2: #e2c98a; --bg0: #07090f; --bg1: #0d1117;
      --bg2: #131920; --bg3: #1a2030; --border: #1e2a3a;
      --text: #e8eaf0; --muted: #6b7a99; --danger: #e74c3c; --green: #2ecc71;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg0); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav { background: rgba(7,9,15,0.95); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
    .nav-logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); text-decoration: none; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    .btn-nav { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; padding: .45rem 1.2rem; border-radius: 6px; font-weight: 700; font-size: .85rem; text-decoration: none; transition: opacity .2s; }
    .btn-nav:hover { opacity: .85; color: #000; }

    /* HERO */
    .hero { background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%); border-bottom: 1px solid var(--border); padding: 3rem 2rem 2.5rem; text-align: center; }
    .hero h1 { font-size: 2.2rem; font-weight: 900; color: var(--gold); margin-bottom: .5rem; }
    .hero p { color: var(--muted); font-size: 1rem; max-width: 500px; margin: 0 auto 1.5rem; }
    .btn-post { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; border: none; padding: .75rem 2rem; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .2s; }
    .btn-post:hover { opacity: .85; }

    /* FILTERS */
    .filters { max-width: 900px; margin: 1.5rem auto; padding: 0 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .filters select, .filters input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: .55rem 1rem; border-radius: 8px; font-family: inherit; font-size: .9rem; flex: 1; min-width: 160px; }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--gold); }
    .filters button { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: .55rem 1.2rem; border-radius: 8px; font-family: inherit; cursor: pointer; transition: all .2s; }
    .filters button:hover { border-color: var(--gold); color: var(--gold); }

    /* GRID */
    .projects-grid { max-width: 900px; margin: 0 auto 3rem; padding: 0 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 1.2rem; }
    .project-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; transition: border-color .2s, transform .2s; cursor: pointer; text-decoration: none; display: block; color: inherit; }
    .project-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .8rem; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.4; }
    .badge { font-size: .7rem; padding: .25rem .6rem; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .badge-published { background: rgba(46,204,113,.15); color: var(--green); }
    .badge-contracted { background: rgba(200,169,110,.15); color: var(--gold); }
    .badge-closed { background: rgba(107,122,153,.15); color: var(--muted); }
    .card-meta { display: flex; gap: .8rem; margin-bottom: .8rem; flex-wrap: wrap; }
    .card-meta span { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: .3rem; }
    .card-meta span::before { content: ''; }
    .card-budget { font-size: .9rem; color: var(--gold); font-weight: 700; margin-bottom: .5rem; }
    .card-bids { font-size: .8rem; color: var(--muted); }
    .card-desc { font-size: .8rem; color: var(--muted); margin-top: .6rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* EMPTY */
    .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); grid-column: 1/-1; }
    .empty h3 { font-size: 1.2rem; margin-bottom: .5rem; color: var(--text); }

    /* LOADING */
    .loading { text-align: center; padding: 3rem; color: var(--muted); grid-column: 1/-1; }

    /* MODAL OVERLAY */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
    .overlay.open { display: flex; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.3rem; font-weight: 700; color: var(--gold); margin-bottom: 1.5rem; }
    .form-row { margin-bottom: 1rem; }
    .form-row label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .35rem; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: .6rem .9rem; border-radius: 8px; font-family: inherit; font-size: .9rem; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--gold); }
    .form-row textarea { resize: vertical; min-height: 80px; }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; border: none; padding: .8rem; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: .5rem; transition: opacity .2s; }
    .btn-submit:hover { opacity: .85; }
    .btn-cancel { background: none; border: 1px solid var(--border); color: var(--muted); padding: .6rem 1.2rem; border-radius: 8px; font-family: inherit; cursor: pointer; margin-top: .5rem; width: 100%; }
    .modal-msg { padding: .6rem .9rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; display: none; }
    .modal-msg.err { background: rgba(231,76,60,.15); color: #e74c3c; display: block; }
    .modal-msg.ok  { background: rgba(46,204,113,.15); color: var(--green); display: block; }

    /* AUTH MODAL */
    .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .auth-tab { flex: 1; text-align: center; padding: .6rem; cursor: pointer; font-size: .9rem; color: var(--muted); background: var(--bg3); transition: all .2s; }
    .auth-tab.active { background: var(--gold); color: #000; font-weight: 700; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">بُنيان</a>
  <div class="nav-links">
    <a href="index.html">الشركات</a>
    <a href="projects.html" class="active">سوق المشاريع</a>
    <a href="company_dashboard.html" class="btn-nav" id="navDashBtn">لوحة الشركة</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>🏗 سوق المشاريع</h1>
  <p>انشر مشروعك وتلقّ عروض أسعار من أفضل شركات المقاولات في العراق</p>
  <button class="btn-post" onclick="openPostProject()">+ أضف مشروعك</button>
</div>

<!-- FILTERS -->
<div class="filters">
  <select id="filterCity" onchange="loadProjects()">
    <option value="">جميع المدن</option>
    <option>بغداد</option><option>البصرة</option><option>أربيل</option>
    <option>الموصل</option><option>النجف</option><option>كربلاء</option>
    <option>السليمانية</option><option>كركوك</option><option>الحلة</option>
    <option>الرمادي</option><option>تكريت</option><option>العمارة</option>
  </select>
  <select id="filterCategory" onchange="loadProjects()">
    <option value="">جميع التخصصات</option>
    <option>مقاولات عامة</option><option>تصميم معماري</option>
    <option>كهرباء وأنظمة</option><option>تمديدات صحية</option>
    <option>تشطيبات داخلية</option><option>بنية تحتية</option>
    <option>مقاولات حكومية</option><option>أخرى</option>
  </select>
  <button onclick="clearFilters()">إعادة تعيين</button>
</div>

<!-- GRID -->
<div class="projects-grid" id="grid">
  <div class="loading">جاري التحميل...</div>
</div>

<!-- POST PROJECT MODAL -->
<div class="overlay" id="overlayPost">
  <div class="modal">
    <h2>📋 نشر مشروع جديد</h2>
    <div class="modal-msg" id="postMsg"></div>

    <!-- Auth section (shown if not logged in) -->
    <div id="authSection">
      <p style="color:var(--muted);font-size:.85rem;margin-bottom:1rem;">يجب تسجيل الدخول أو إنشاء حساب لنشر المشروع</p>
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">دخول</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">حساب جديد</div>
      </div>
      <div id="loginForm">
        <div class="form-row"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="your@email.com"></div>
        <div class="form-row"><label>كلمة المرور</label><input id="loginPwd" type="password"></div>
        <button class="btn-submit" onclick="doAuth('login')">دخول</button>
      </div>
      <div id="registerForm" style="display:none">
        <div class="form-row"><label>الاسم الكامل</label><input id="regName" placeholder="محمد علي"></div>
        <div class="form-row"><label>البريد الإلكتروني</label><input id="regEmail" type="email" placeholder="your@email.com"></div>
        <div class="form-row"><label>كلمة المرور (8 أحرف على الأقل)</label><input id="regPwd" type="password"></div>
        <button class="btn-submit" onclick="doAuth('register')">إنشاء حساب</button>
      </div>
    </div>

    <!-- Project form (shown after auth) -->
    <div id="projectForm" style="display:none">
      <div class="form-row"><label>عنوان المشروع *</label><input id="pTitle" placeholder="بناء فيلا سكنية / تشطيب مكتب..."></div>
      <div class="form-grid2">
        <div class="form-row"><label>التخصص المطلوب *</label>
          <select id="pCategory">
            <option>مقاولات عامة</option><option>تصميم معماري</option>
            <option>كهرباء وأنظمة</option><option>تمديدات صحية</option>
            <option>تشطيبات داخلية</option><option>بنية تحتية</option>
            <option>مقاولات حكومية</option><option>أخرى</option>
          </select>
        </div>
        <div class="form-row"><label>المدينة *</label>
          <select id="pCity">
            <option>بغداد</option><option>البصرة</option><option>أربيل</option>
            <option>الموصل</option><option>النجف</option><option>كربلاء</option>
            <option>السليمانية</option><option>كركوك</option><option>أخرى</option>
          </select>
        </div>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label>الميزانية من (دينار)</label><input id="pBudgetMin" type="number" placeholder="5,000,000"></div>
        <div class="form-row"><label>الميزانية إلى (دينار)</label><input id="pBudgetMax" type="number" placeholder="15,000,000"></div>
      </div>
      <div class="form-row"><label>وصف المشروع</label><textarea id="pDesc" placeholder="تفاصيل المشروع، المساحة، المواصفات..."></textarea></div>
      <div class="form-row"><label>اسم صاحب المشروع *</label><input id="pContactName" placeholder="محمد علي"></div>
      <div class="form-grid2">
        <div class="form-row"><label>رقم الهاتف *</label><input id="pContactPhone" placeholder="07XXXXXXXXX"></div>
        <div class="form-row"><label>البريد الإلكتروني</label><input id="pContactEmail" type="email" placeholder="اختياري"></div>
      </div>
      <button class="btn-submit" onclick="submitProject()">نشر المشروع</button>
    </div>
    <button class="btn-cancel" onclick="closePost()">إلغاء</button>
  </div>
</div>

<script>
const API = '';
let USER_TOKEN = localStorage.getItem('project_user_token') || '';
let USER_ID    = localStorage.getItem('project_user_id') || '';

function fmt(n) {
  if (n == null) return '';
  return Number(n).toLocaleString('ar-IQ') + ' د.ع';
}

function budgetText(min, max) {
  if (min && max) return `${fmt(min)} — ${fmt(max)}`;
  if (min) return `من ${fmt(min)}`;
  if (max) return `حتى ${fmt(max)}`;
  return 'السعر مفتوح';
}

async function loadProjects() {
  const city     = document.getElementById('filterCity').value;
  const category = document.getElementById('filterCategory').value;
  let url = `${API}/projects?`;
  if (city)     url += `city=${encodeURIComponent(city)}&`;
  if (category) url += `category=${encodeURIComponent(category)}&`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">جاري التحميل...</div>';

  try {
    const r = await fetch(url);
    const projects = await r.json();
    renderProjects(projects);
  } catch(e) {
    grid.innerHTML = '<div class="empty"><h3>خطأ في التحميل</h3><p>تأكد من الاتصال بالإنترنت</p></div>';
  }
}

function renderProjects(list) {
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><h3>لا توجد مشاريع حالياً</h3><p>كن أول من ينشر مشروعه!</p></div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <a class="project-card" href="project_details.html?id=${p.id}">
      <div class="card-header">
        <div class="card-title">${esc(p.title)}</div>
        <span class="badge badge-${p.status}">${statusLabel(p.status)}</span>
      </div>
      <div class="card-meta">
        <span>📍 ${esc(p.city)}</span>
        <span>🔨 ${esc(p.category)}</span>
      </div>
      <div class="card-budget">${budgetText(p.budget_min, p.budget_max)}</div>
      <div class="card-bids">💬 ${p.bids_count} عرض</div>
      ${p.description ? `<div class="card-desc">${esc(p.description)}</div>` : ''}
    </a>
  `).join('');
}

function statusLabel(s) {
  return {published:'مفتوح',contracted:'تم الاختيار',closed:'مغلق',cancelled:'ملغي',pending:'قيد المراجعة'}[s] || s;
}

function clearFilters() {
  document.getElementById('filterCity').value = '';
  document.getElementById('filterCategory').value = '';
  loadProjects();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── AUTH + POST PROJECT ───────────────────────────────────────────────────────

function openPostProject() {
  document.getElementById('overlayPost').classList.add('open');
  document.getElementById('postMsg').className = 'modal-msg';
  document.getElementById('postMsg').textContent = '';
  if (USER_TOKEN) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('projectForm').style.display = 'block';
  } else {
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('projectForm').style.display = 'none';
  }
}

function closePost() {
  document.getElementById('overlayPost').classList.remove('open');
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'?i===0:i===1)));
  document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function setMsg(txt, type) {
  const el = document.getElementById('postMsg');
  el.textContent = txt;
  el.className = 'modal-msg ' + type;
}

async function doAuth(mode) {
  setMsg('', '');
  let body, url;
  if (mode === 'login') {
    body = { email: document.getElementById('loginEmail').value, password: document.getElementById('loginPwd').value };
    url = `${API}/auth/login`;
  } else {
    body = { email: document.getElementById('regEmail').value, password: document.getElementById('regPwd').value, display_name: document.getElementById('regName').value };
    url = `${API}/auth/register`;
  }
  try {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { setMsg(d.detail || 'خطأ في المصادقة', 'err'); return; }
    USER_TOKEN = d.token;
    USER_ID    = d.user_id;
    localStorage.setItem('project_user_token', USER_TOKEN);
    localStorage.setItem('project_user_id', USER_ID);
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('projectForm').style.display = 'block';
    setMsg('تم تسجيل الدخول بنجاح', 'ok');
  } catch(e) {
    setMsg('خطأ في الاتصال', 'err');
  }
}

async function submitProject() {
  setMsg('', '');
  const title = document.getElementById('pTitle').value.trim();
  const contactName  = document.getElementById('pContactName').value.trim();
  const contactPhone = document.getElementById('pContactPhone').value.trim();
  if (!title || !contactName || !contactPhone) {
    setMsg('يرجى ملء الحقول المطلوبة (*)','err'); return;
  }
  const body = {
    title, category: document.getElementById('pCategory').value,
    city: document.getElementById('pCity').value, country: 'IQ',
    budget_min: document.getElementById('pBudgetMin').value ? Number(document.getElementById('pBudgetMin').value) : null,
    budget_max: document.getElementById('pBudgetMax').value ? Number(document.getElementById('pBudgetMax').value) : null,
    description: document.getElementById('pDesc').value.trim(),
    contact_name: contactName, contact_phone: contactPhone,
    contact_email: document.getElementById('pContactEmail').value.trim() || null,
  };
  try {
    const r = await fetch(`${API}/projects`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': USER_TOKEN },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) { setMsg(d.detail || 'حدث خطأ', 'err'); return; }
    setMsg('تم نشر المشروع بنجاح!', 'ok');
    setTimeout(() => { closePost(); loadProjects(); window.location.href = `project_details.html?id=${d.id}`; }, 1200);
  } catch(e) {
    setMsg('خطأ في الاتصال', 'err');
  }
}

// Close on backdrop click
document.getElementById('overlayPost').addEventListener('click', function(e) {
  if (e.target === this) closePost();
});

// Init
loadProjects();
</script>
</body>
</html>
