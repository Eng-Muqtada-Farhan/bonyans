<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بُنيان — ملف الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold:    #c8a96e;
  --gold-lt: #e2c99a;
  --bg0:     #07090f;
  --bg1:     #0d1117;
  --bg2:     #131920;
  --bg3:     #1a2030;
  --border:  rgba(200,169,110,0.15);
  --border2: rgba(200,169,110,0.30);
  --text1:   #f0ede8;
  --text2:   #a09880;
  --radius:  14px;
  --green:   #3fb950;
  --red:     #f85149;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background: var(--bg0); color: var(--text1); min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(200,169,110,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,169,110,0.03) 1px, transparent 1px);
  background-size: 60px 60px; pointer-events: none;
}

/* ── Top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(7,9,15,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand { font-size: 20px; font-weight: 900; color: var(--gold); text-decoration: none; }
.topbar-back { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 13px; text-decoration: none; transition: color .2s; }
.topbar-back:hover { color: var(--gold); }
#topbar-user { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 10px; }
#topbar-user .user-name { color: var(--gold-lt); }
#btn-login-top { padding: 5px 14px; border: 1px solid var(--border2); border-radius: 8px; background: transparent; color: var(--gold); font-family: Cairo,sans-serif; font-size: 13px; cursor: pointer; }
#btn-login-top:hover { background: rgba(200,169,110,.08); }

/* ── Page ── */
.page { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; position: relative; z-index: 1; }

/* ── Hero ── */
.hero {
  background: var(--bg1); border: 1px solid var(--border); border-radius: 20px;
  padding: 36px; display: flex; gap: 28px; align-items: flex-start;
  margin-bottom: 32px; position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 80% at 80% -20%, rgba(200,169,110,0.06), transparent 70%);
  pointer-events: none;
}
.hero-logo { width: 100px; height: 100px; border-radius: 16px; object-fit: cover; border: 2px solid var(--border2); flex-shrink: 0; }
.hero-logo-ph { width: 100px; height: 100px; border-radius: 16px; background: var(--bg3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 42px; flex-shrink: 0; }
.hero-info { flex: 1; min-width: 0; }
.hero-name { font-size: 28px; font-weight: 900; color: var(--text1); margin-bottom: 6px; }
.hero-spec { display: inline-block; font-size: 12px; color: var(--gold); background: rgba(200,169,110,0.08); border: 1px solid rgba(200,169,110,0.2); border-radius: 20px; padding: 3px 14px; margin-bottom: 10px; }
.hero-city { font-size: 14px; color: var(--text2); margin-bottom: 12px; }
.hero-desc { font-size: 14px; color: var(--text2); line-height: 1.8; }
.hero-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
.badge-verified { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: var(--green); }
.badge-premium  { background: rgba(200,169,110,0.1); border: 1px solid rgba(200,169,110,0.3); color: var(--gold); }
.badge-approved { background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.2); color: #7ee787; }

/* ── Chat button ── */
.btn-chat {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, #c8a96e, #e2c98a);
  color: #000; border: none; border-radius: 10px; padding: 9px 20px;
  font-family: Cairo,sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .2s; flex-shrink: 0;
}
.btn-chat:hover { opacity: .88; }

/* ── Contact strip ── */
.contact-strip { display: flex; flex-wrap: wrap; gap: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 32px; }
.contact-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.contact-item a { color: var(--gold); text-decoration: none; }
.contact-item a:hover { text-decoration: underline; }
.btn-whatsapp { display: inline-flex; align-items: center; gap: 8px; background: #25d366; color: white; border: none; border-radius: 10px; padding: 9px 20px; font-family: Cairo,sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: opacity .2s; }
.btn-whatsapp:hover { opacity: .88; }

/* ── Section headers ── */
.section-hdr { font-size: 17px; font-weight: 700; color: var(--gold); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.section-hdr .count { background: rgba(200,169,110,0.12); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text2); border-radius: 20px; padding: 2px 10px; }

/* ── Projects ── */
.projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-bottom: 40px; }
.proj-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color .2s, transform .2s; }
.proj-card:hover { border-color: var(--border2); transform: translateY(-2px); }
.proj-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--bg3); }
.proj-img-ph { width: 100%; aspect-ratio: 16/9; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--text2); }
.proj-body { padding: 16px; }
.proj-title { font-size: 15px; font-weight: 700; color: var(--text1); margin-bottom: 6px; }
.proj-meta  { font-size: 12px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; }
.proj-desc  { font-size: 13px; color: var(--text2); margin-top: 8px; line-height: 1.7; }

/* ── Gallery ── */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 12px; margin-bottom: 40px; }
.gal-item { position: relative; overflow: hidden; border-radius: 12px; cursor: pointer; }
.gal-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border: 1px solid var(--border); border-radius: 12px; transition: transform .3s; }
.gal-item:hover img { transform: scale(1.04); }
.gal-title-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.7)); padding: 20px 10px 8px; font-size: 12px; color: white; opacity: 0; transition: opacity .2s; border-radius: 0 0 12px 12px; }
.gal-item:hover .gal-title-overlay { opacity: 1; }

/* ── Reviews section ── */
.reviews-wrap { margin-bottom: 40px; }
.reviews-summary {
  display: flex; align-items: center; gap: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 22px; margin-bottom: 20px;
}
.reviews-avg-big { font-size: 40px; font-weight: 900; color: var(--gold); line-height: 1; }
.reviews-stars-row { display: flex; gap: 3px; font-size: 20px; color: var(--gold); margin: 4px 0; }
.reviews-count-text { font-size: 13px; color: var(--text2); }

.review-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.review-name { font-weight: 700; font-size: 14px; }
.review-stars { font-size: 15px; color: var(--gold); letter-spacing: 2px; }
.review-comment { font-size: 13px; color: var(--text2); line-height: 1.75; }
.review-reply { margin-top: 12px; padding: 10px 14px; background: var(--bg3); border-right: 3px solid var(--gold); border-radius: 8px; font-size: 12px; color: var(--text2); }
.review-reply-label { font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.review-date { font-size: 11px; color: var(--text2); opacity: .6; }

/* ── Review form ── */
.review-form-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 20px; }
.review-form-title { font-size: 15px; font-weight: 700; color: var(--text1); margin-bottom: 14px; }
.star-picker { display: flex; gap: 8px; margin-bottom: 14px; direction: rtl; }
.star-btn { font-size: 28px; color: var(--text2); cursor: pointer; transition: transform .1s; background: none; border: none; padding: 0; line-height: 1; }
.star-btn.active { color: var(--gold); transform: scale(1.15); }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
.form-input { width: 100%; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text1); font-family: Cairo,sans-serif; font-size: 13px; outline: none; }
.form-input:focus { border-color: var(--gold); }
textarea.form-input { resize: vertical; min-height: 70px; }
.btn-submit-review { padding: 9px 22px; background: linear-gradient(135deg,#c8a96e,#e2c98a); color: #000; border: none; border-radius: 8px; font-family: Cairo,sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
.btn-submit-review:hover { opacity: .88; }
.btn-submit-review:disabled { opacity: .5; cursor: default; }
.review-msg { margin-top: 8px; font-size: 13px; padding: 6px 10px; border-radius: 6px; display: none; }
.review-msg.ok  { display: block; color: var(--green); background: rgba(63,185,80,.1); }
.review-msg.err { display: block; color: var(--red); background: rgba(248,81,73,.1); }

/* ── Lightbox ── */
#lightbox { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.92); align-items: center; justify-content: center; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 10px; object-fit: contain; }
#lightboxClose { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,.1); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* ── Login modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--bg1); border: 1px solid var(--border2); border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; position: relative; }
.modal-close { position: absolute; top: 14px; left: 14px; background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px 8px; }
.modal-close:hover { color: var(--text1); }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text1); margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 22px; }
.auth-tabs { display: flex; gap: 0; background: var(--bg2); border-radius: 8px; padding: 4px; margin-bottom: 18px; }
.auth-tab { flex: 1; padding: 7px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; border-radius: 6px; transition: background .2s, color .2s; }
.auth-tab.active { background: var(--bg3); color: var(--gold); }
.modal-input { width: 100%; padding: 10px 13px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text1); font-family: Cairo,sans-serif; font-size: 13px; outline: none; margin-bottom: 10px; }
.modal-input:focus { border-color: var(--gold); }
.btn-modal-submit { width: 100%; padding: 11px; background: linear-gradient(135deg,#c8a96e,#e2c98a); color: #000; border: none; border-radius: 10px; font-family: Cairo,sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: opacity .2s; }
.btn-modal-submit:hover { opacity: .88; }
.modal-err { font-size: 13px; color: var(--red); margin-top: 8px; min-height: 18px; }

/* ── Chat drawer ── */
#chatDrawer {
  display: none; position: fixed; bottom: 0; right: 0; left: 0; z-index: 600;
  max-width: 480px; margin: 0 auto;
  background: var(--bg1); border: 1px solid var(--border2);
  border-bottom: none; border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.5);
  flex-direction: column; height: 460px;
}
#chatDrawer.open { display: flex; }
.chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.chat-header-name { font-weight: 700; font-size: 15px; }
.chat-header-sub  { font-size: 12px; color: var(--text2); margin-top: 1px; }
.chat-close { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 4px 8px; }
.chat-close:hover { color: var(--text1); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-bubble { max-width: 72%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
.chat-bubble.me    { align-self: flex-end; background: var(--bg3); color: var(--text1); border-bottom-right-radius: 4px; }
.chat-bubble.other { align-self: flex-start; background: rgba(200,169,110,0.12); color: var(--text1); border-bottom-left-radius: 4px; }
.chat-bubble-time  { font-size: 10px; color: var(--text2); margin-top: 3px; }
.chat-input-row { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-input { flex: 1; padding: 9px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text1); font-family: Cairo,sans-serif; font-size: 13px; outline: none; }
.chat-input:focus { border-color: var(--gold); }
.btn-send { padding: 9px 16px; background: linear-gradient(135deg,#c8a96e,#e2c98a); color: #000; border: none; border-radius: 10px; font-family: Cairo,sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
.chat-state-msg { text-align: center; padding: 20px; font-size: 13px; color: var(--text2); }

/* ── States ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }
.empty-state .icon { font-size: 36px; margin-bottom: 10px; }
.not-found { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text2); }
.not-found .icon { font-size: 56px; margin-bottom: 16px; }
.not-found h2 { font-size: 22px; color: var(--text1); margin-bottom: 8px; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <a href="index.html" class="topbar-brand">بُنيان</a>
  <div id="topbar-user">
    <span id="user-greeting" style="display:none">مرحباً، <span class="user-name" id="user-display-name"></span></span>
    <button id="btn-login-top" onclick="openLoginModal()">تسجيل الدخول</button>
  </div>
  <a href="index.html" class="topbar-back">← العودة للدليل</a>
</div>

<!-- Page -->
<div class="page" id="page">
  <div style="color:var(--text2);font-size:14px;text-align:center;padding:60px;">جارٍ تحميل ملف الشركة...</div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightboxClose" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginOverlay" onclick="if(event.target===this)closeLoginModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeLoginModal()">✕</button>
    <div class="modal-title">تسجيل الدخول</div>
    <div class="modal-sub">للتواصل مع الشركة يجب تسجيل الدخول أو إنشاء حساب</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">دخول</div>
      <div class="auth-tab"        id="tab-reg"   onclick="switchTab('reg')">حساب جديد</div>
    </div>
    <div id="login-form">
      <input class="modal-input" id="li-email"    type="email"    placeholder="البريد الإلكتروني" autocomplete="email">
      <input class="modal-input" id="li-password" type="password" placeholder="كلمة المرور">
      <button class="btn-modal-submit" onclick="doLogin()">دخول</button>
    </div>
    <div id="reg-form" style="display:none">
      <input class="modal-input" id="ri-name"     type="text"     placeholder="الاسم الكامل">
      <input class="modal-input" id="ri-email"    type="email"    placeholder="البريد الإلكتروني">
      <input class="modal-input" id="ri-password" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)">
      <button class="btn-modal-submit" onclick="doRegister()">إنشاء حساب</button>
    </div>
    <div class="modal-err" id="auth-err"></div>
  </div>
</div>

<!-- Chat Drawer -->
<div id="chatDrawer">
  <div class="chat-header">
    <div>
      <div class="chat-header-name" id="chatCompanyName">—</div>
      <div class="chat-header-sub">محادثة مباشرة</div>
    </div>
    <button class="chat-close" onclick="closeChat()">✕</button>
  </div>
  <div class="chat-msgs" id="chatMsgs">
    <div class="chat-state-msg">جارٍ تحميل المحادثة...</div>
  </div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" type="text" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendChatMsg()">
    <button class="btn-send" onclick="sendChatMsg()">إرسال</button>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
const params    = new URLSearchParams(location.search);
const companyId = parseInt(params.get('id') || '0');

/* ── Auth state ── */
let USER_TOKEN = localStorage.getItem('project_user_token') || '';
let USER_ID    = parseInt(localStorage.getItem('project_user_id') || '0');
let USER_NAME  = localStorage.getItem('project_user_name') || '';

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Topbar user state ── */
function refreshTopbar() {
  const greeting = document.getElementById('user-greeting');
  const btnLogin = document.getElementById('btn-login-top');
  if (USER_TOKEN) {
    document.getElementById('user-display-name').textContent = USER_NAME || 'مستخدم';
    greeting.style.display = 'inline';
    btnLogin.style.display = 'none';
  } else {
    greeting.style.display = 'none';
    btnLogin.style.display = 'inline';
  }
}

/* ── Lightbox ── */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') { closeLightbox(); closeLoginModal(); closeChat(); } });

/* ═══════════════ LOGIN MODAL ═══════════════ */
let _afterLoginFn = null;

function openLoginModal(afterFn = null) {
  _afterLoginFn = afterFn;
  document.getElementById('loginOverlay').classList.add('open');
  document.getElementById('auth-err').textContent = '';
}
function closeLoginModal() {
  document.getElementById('loginOverlay').classList.remove('open');
}
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-reg').classList.toggle('active', tab==='reg');
  document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('reg-form').style.display   = tab==='reg'   ? 'block' : 'none';
  document.getElementById('auth-err').textContent = '';
}

async function doLogin() {
  const email    = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const errEl    = document.getElementById('auth-err');
  if (!email || !password) { errEl.textContent = 'يرجى ملء جميع الحقول'; return; }
  errEl.textContent = '';
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || 'خطأ في تسجيل الدخول'; return; }
    _setUser(d.token, d.user_id, d.display_name || email.split('@')[0]);
    closeLoginModal();
    if (_afterLoginFn) { _afterLoginFn(); _afterLoginFn = null; }
  } catch { errEl.textContent = 'خطأ في الاتصال'; }
}

async function doRegister() {
  const name     = document.getElementById('ri-name').value.trim();
  const email    = document.getElementById('ri-email').value.trim();
  const password = document.getElementById('ri-password').value;
  const errEl    = document.getElementById('auth-err');
  if (!name || !email || !password) { errEl.textContent = 'يرجى ملء جميع الحقول'; return; }
  if (password.length < 8) { errEl.textContent = 'كلمة المرور 8 أحرف على الأقل'; return; }
  errEl.textContent = '';
  try {
    const r = await fetch(`${API}/auth/register`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password, display_name: name})
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || 'خطأ في إنشاء الحساب'; return; }
    _setUser(d.token, d.user_id, name);
    closeLoginModal();
    if (_afterLoginFn) { _afterLoginFn(); _afterLoginFn = null; }
  } catch { errEl.textContent = 'خطأ في الاتصال'; }
}

function _setUser(token, id, name) {
  USER_TOKEN = token; USER_ID = id; USER_NAME = name;
  localStorage.setItem('project_user_token', token);
  localStorage.setItem('project_user_id', String(id));
  localStorage.setItem('project_user_name', name);
  refreshTopbar();
}

/* ═══════════════ CHAT ═══════════════ */
let _convId = null;
let _chatCompanyName = '';
let _chatPollTimer = null;

function openChatBtn() {
  if (!USER_TOKEN) {
    openLoginModal(() => openChatBtn());
    return;
  }
  startOrOpenChat();
}

async function startOrOpenChat() {
  const drawer = document.getElementById('chatDrawer');
  document.getElementById('chatCompanyName').textContent = _chatCompanyName;
  drawer.classList.add('open');

  const msgsEl = document.getElementById('chatMsgs');
  msgsEl.innerHTML = '<div class="chat-state-msg">جارٍ تحضير المحادثة...</div>';

  try {
    /* POST /conversations creates or returns existing conv */
    const r = await fetch(`${API}/conversations`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': USER_TOKEN},
      body: JSON.stringify({company_id: companyId, message: ' '})
    });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    _convId = d.conversation_id;
    await loadChatMsgs();
    _startChatPoll();
  } catch(e) {
    msgsEl.innerHTML = `<div class="chat-state-msg" style="color:var(--red)">خطأ: ${esc(e.message)}</div>`;
  }
}

async function loadChatMsgs() {
  if (!_convId) return;
  const msgsEl = document.getElementById('chatMsgs');
  try {
    const r = await fetch(`${API}/conversations/${_convId}/messages`, {
      headers: {'Authorization': USER_TOKEN}
    });
    if (!r.ok) return;
    const msgs = await r.json();
    /* filter out the blank opener message */
    const visible = msgs.filter(m => m.message && m.message.trim() !== ' ');
    if (!visible.length) {
      msgsEl.innerHTML = '<div class="chat-state-msg">ابدأ المحادثة بكتابة رسالتك أدناه</div>';
    } else {
      msgsEl.innerHTML = visible.map(m => {
        const isMe = m.sender_type === 'client';
        const time = new Date(m.created_at).toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
        return `<div>
          <div class="chat-bubble ${isMe ? 'me' : 'other'}">${esc(m.message)}</div>
          <div class="chat-bubble-time" style="text-align:${isMe?'left':'right'}">${time}</div>
        </div>`;
      }).join('');
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  } catch {}
}

async function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const msg   = input.value.trim();
  if (!msg || !_convId) return;
  input.value = '';

  try {
    /* If this is the first real message, we already have the conv but the blank opener exists.
       Just send a new message directly. */
    await fetch(`${API}/conversations/${_convId}/messages`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': USER_TOKEN},
      body: JSON.stringify({message: msg})
    });
    await loadChatMsgs();
  } catch { input.value = msg; }
}

function _startChatPoll() {
  _stopChatPoll();
  _chatPollTimer = setInterval(loadChatMsgs, 5000);
}
function _stopChatPoll() {
  if (_chatPollTimer) { clearInterval(_chatPollTimer); _chatPollTimer = null; }
}
function closeChat() {
  document.getElementById('chatDrawer').classList.remove('open');
  _stopChatPoll();
}

/* ═══════════════ REVIEWS ═══════════════ */
let _selectedRating = 0;

function starsHtml(rating, size = 16) {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    h += `<span style="color:${i <= rating ? 'var(--gold)' : 'var(--text2)' };font-size:${size}px">★</span>`;
  }
  return h;
}

async function loadReviews() {
  const el = document.getElementById('reviewsBody');
  if (!el) return;
  try {
    const r = await fetch(`${API}/company/${companyId}/reviews`);
    const reviews = await r.json();

    /* summary */
    const summaryEl = document.getElementById('reviewsSummary');
    if (reviews.length) {
      const avg = reviews.reduce((s,rv)=>s+rv.rating,0) / reviews.length;
      const avgRounded = Math.round(avg * 10) / 10;
      summaryEl.innerHTML = `
        <div class="reviews-avg-big">${avgRounded.toFixed(1)}</div>
        <div>
          <div class="reviews-stars-row">${starsHtml(Math.round(avg), 20)}</div>
          <div class="reviews-count-text">${reviews.length} تقييم معتمد</div>
        </div>`;
    } else {
      summaryEl.innerHTML = `<div style="color:var(--text2);font-size:13px">لا توجد تقييمات معتمدة بعد</div>`;
    }

    /* list */
    if (!reviews.length) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = reviews.map(rv => {
      const d = new Date(rv.created_at).toLocaleDateString('ar-IQ');
      return `
        <div class="review-card">
          <div class="review-header">
            <span class="review-name">${esc(rv.client_name)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="review-stars">${starsHtml(rv.rating)}</span>
              <span class="review-date">${d}</span>
            </div>
          </div>
          ${rv.comment ? `<div class="review-comment">${esc(rv.comment)}</div>` : ''}
          ${rv.reply ? `
            <div class="review-reply">
              <div class="review-reply-label">رد الشركة</div>
              ${esc(rv.reply)}
            </div>` : ''}
        </div>`;
    }).join('');
  } catch {
    document.getElementById('reviewsSummary').innerHTML = '';
  }
}

function setRating(n) {
  _selectedRating = n;
  document.querySelectorAll('.star-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i < n);
  });
}

async function submitReview() {
  const clientName = document.getElementById('rv-name').value.trim();
  const comment    = document.getElementById('rv-comment').value.trim();
  const msgEl      = document.getElementById('rv-msg');
  msgEl.className  = 'review-msg';

  if (!clientName) { msgEl.textContent='يرجى إدخال اسمك'; msgEl.classList.add('err'); return; }
  if (!_selectedRating) { msgEl.textContent='يرجى اختيار عدد النجوم'; msgEl.classList.add('err'); return; }

  const btn = document.getElementById('btn-submit-review');
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';

  try {
    const r = await fetch(`${API}/reviews`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({company_id: companyId, client_name: clientName, rating: _selectedRating, comment})
    });
    if (r.status === 409) { msgEl.textContent='سبق وأرسلت تقييماً لهذه الشركة'; msgEl.classList.add('err'); return; }
    if (!r.ok) throw new Error();
    msgEl.textContent = 'شكراً! سيظهر تقييمك بعد مراجعته من الإدارة ✓';
    msgEl.classList.add('ok');
    document.getElementById('rv-name').value = '';
    document.getElementById('rv-comment').value = '';
    setRating(0);
  } catch { msgEl.textContent = 'خطأ في الإرسال، يرجى المحاولة مجدداً'; msgEl.classList.add('err'); }
  finally { btn.disabled = false; btn.textContent = 'إرسال التقييم'; }
}

/* ═══════════════ PAGE LOAD ═══════════════ */
async function load() {
  const page = document.getElementById('page');
  if (!companyId) {
    page.innerHTML = notFound('رابط غير صحيح', 'لم يتم تحديد رقم الشركة في الرابط.'); return;
  }
  try {
    const r = await fetch(`${API}/company/${companyId}`);
    if (r.status === 404) { page.innerHTML = notFound('الشركة غير موجودة', 'هذه الشركة غير موجودة أو لم تحصل على الموافقة بعد.'); return; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const { company: c, projects, gallery } = await r.json();
    document.title = `بُنيان — ${c.name}`;
    _chatCompanyName = c.name;
    page.innerHTML = renderPage(c, projects, gallery);
    loadReviews();
  } catch {
    page.innerHTML = notFound('خطأ في التحميل', 'تعذّر الاتصال بالسيرفر.');
  }
}

function notFound(title, sub) {
  return `<div class="not-found"><div class="icon">🏗</div><h2>${title}</h2><p>${sub}</p>
    <a href="index.html" style="color:var(--gold);margin-top:16px;display:inline-block;">← العودة للدليل</a></div>`;
}

function renderPage(c, projects, gallery) {
  /* ── Hero ── */
  const logoHtml = c.image_url
    ? `<img class="hero-logo" src="${esc(c.image_url)}" alt="${esc(c.name)}" onerror="this.outerHTML='<div class=\\'hero-logo-ph\\'>🏢</div>'">`
    : `<div class="hero-logo-ph">🏢</div>`;

  const vsBadge = {
    verified: '<span class="badge badge-verified">✔ موثّق</span>',
    premium:  '<span class="badge badge-premium">★ بريميوم</span>',
  }[c.verification_status] || '';

  const hero = `
    <div class="hero">
      ${logoHtml}
      <div class="hero-info">
        <div class="hero-name">${esc(c.name)}</div>
        <span class="hero-spec">${esc(c.spec)}</span>
        <div class="hero-city">📍 ${esc(c.city)}</div>
        ${c.desc ? `<div class="hero-desc">${esc(c.desc)}</div>` : ''}
        <div class="hero-badges">
          <span class="badge badge-approved">✓ معتمد في الدليل</span>
          ${vsBadge}
          <button class="btn-chat" onclick="openChatBtn()">📬 تواصل مع الشركة</button>
        </div>
      </div>
    </div>`;

  /* ── Contact strip ── */
  const contactItems = [];
  if (c.phone) {
    const num = c.phone.replace(/\D/g,'');
    contactItems.push(`
      <div class="contact-item"><span>📞</span><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>
      <a href="https://wa.me/${num}" target="_blank" rel="noopener" class="btn-whatsapp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        واتساب
      </a>`);
  }
  if (c.email) contactItems.push(`<div class="contact-item"><span>✉️</span><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`);
  if (c.website) contactItems.push(`<div class="contact-item"><span>🌐</span><a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website)}</a></div>`);
  if (c.map_link) contactItems.push(`<div class="contact-item"><span>📍</span><a href="${esc(c.map_link)}" target="_blank" rel="noopener">عرض على الخريطة</a></div>`);
  const contact = contactItems.length ? `<div class="contact-strip">${contactItems.join('')}</div>` : '';

  /* ── Projects ── */
  let projectsSection = '';
  if (projects && projects.length) {
    const cards = projects.map(p => `
      <div class="proj-card">
        ${p.image_url ? `<img class="proj-img" src="${esc(p.image_url)}" alt="${esc(p.title)}" onerror="this.outerHTML='<div class=\\'proj-img-ph\\'>🏗</div>'">` : `<div class="proj-img-ph">🏗</div>`}
        <div class="proj-body">
          <div class="proj-title">${esc(p.title)}</div>
          <div class="proj-meta">${p.location?`<span>📍 ${esc(p.location)}</span>`:''} ${p.completion_date?`<span>📅 ${esc(p.completion_date)}</span>`:''}</div>
          ${p.description ? `<div class="proj-desc">${esc(p.description)}</div>` : ''}
        </div>
      </div>`).join('');
    projectsSection = `<div class="section-hdr">🏗 المشاريع <span class="count">${projects.length}</span></div><div class="projects-grid">${cards}</div>`;
  }

  /* ── Gallery ── */
  let gallerySection = '';
  if (gallery && gallery.length) {
    const imgs = gallery.map(img => `
      <div class="gal-item" onclick="openLightbox('${esc(img.image_url)}')">
        <img src="${esc(img.image_url)}" alt="${esc(img.title||'')}" onerror="this.style.display='none'">
        ${img.title ? `<div class="gal-title-overlay">${esc(img.title)}</div>` : ''}
      </div>`).join('');
    gallerySection = `<div class="section-hdr">🖼 معرض الصور <span class="count">${gallery.length}</span></div><div class="gallery-grid">${imgs}</div>`;
  }

  /* ── Reviews section ── */
  const reviewsSection = `
    <div class="reviews-wrap">
      <div class="section-hdr">⭐ التقييمات</div>
      <div class="reviews-summary" id="reviewsSummary">
        <div style="color:var(--text2);font-size:13px">جارٍ تحميل التقييمات...</div>
      </div>
      <div id="reviewsBody"></div>
      <div class="review-form-wrap">
        <div class="review-form-title">أضف تقييمك</div>
        <div class="form-group">
          <label>اسمك</label>
          <input class="form-input" id="rv-name" type="text" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label>التقييم</label>
          <div class="star-picker">
            ${[1,2,3,4,5].map(n=>`<button class="star-btn" onclick="setRating(${n})">★</button>`).join('')}
          </div>
        </div>
        <div class="form-group">
          <label>التعليق (اختياري)</label>
          <textarea class="form-input" id="rv-comment" placeholder="اكتب تجربتك مع الشركة..."></textarea>
        </div>
        <button class="btn-submit-review" id="btn-submit-review" onclick="submitReview()">إرسال التقييم</button>
        <div class="review-msg" id="rv-msg"></div>
      </div>
    </div>`;

  return hero + contact + projectsSection + gallerySection + reviewsSection;
}

refreshTopbar();
load();
</script>
</body>
</html>
