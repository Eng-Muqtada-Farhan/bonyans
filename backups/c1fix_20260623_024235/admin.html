<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة — بُنيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="bunyan.css?v=11a">
<style>
/* ══ Admin-specific overrides ══ */
body { font-family: 'Cairo', sans-serif; }

.adm-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 80px 16px 40px;
}

/* login card */
.adm-login {
  max-width: 380px;
  margin: 120px auto 0;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px);
  border: 1.5px solid rgba(255,255,255,0.88);
  border-radius: 20px;
  padding: 36px 28px;
  box-shadow: 0 8px 32px rgba(27,58,107,0.10);
}
[data-theme="dark"] .adm-login {
  background: rgba(15,35,71,0.72);
  border-color: rgba(255,255,255,0.10);
}
.adm-login h2 {
  margin: 0 0 24px;
  font-size: 22px;
  color: var(--clay-deep);
  text-align: center;
}
.adm-login input {
  width: 100%;
  box-sizing: border-box;
  background: rgba(255,255,255,0.80);
  border: 1.5px solid rgba(27,58,107,0.18);
  border-radius: 10px;
  padding: 11px 14px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--text-1);
  margin-bottom: 12px;
  direction: ltr;
}
[data-theme="dark"] .adm-login input {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
  color: #e8eaf6;
}
.adm-login-btn {
  width: 100%;
  padding: 12px;
  background: var(--clay);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.adm-login-btn:hover { background: var(--clay-deep); }

/* tabs */
.adm-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.adm-tab {
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(255,255,255,0.65);
  border: 1.5px solid rgba(255,255,255,0.85);
  color: var(--text-2);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.adm-tab.active, .adm-tab:hover {
  background: var(--clay);
  border-color: var(--clay);
  color: #fff;
}

/* header bar */
.adm-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.adm-header h2 {
  margin: 0;
  font-size: 22px;
  color: var(--clay-deep);
  flex: 1;
}
.adm-logout-btn {
  padding: 8px 16px;
  background: rgba(255,255,255,0.70);
  border: 1.5px solid rgba(27,58,107,0.18);
  border-radius: 10px;
  color: var(--clay);
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* cards */
.adm-card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255,255,255,0.88);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(27,58,107,0.07);
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
[data-theme="dark"] .adm-card {
  background: rgba(15,35,71,0.60);
  border-color: rgba(255,255,255,0.08);
}
.adm-card-thumb {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  object-fit: cover;
  border: 1.5px solid rgba(255,255,255,0.80);
  flex-shrink: 0;
}
.adm-card-icon {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  background: rgba(27,58,107,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.adm-card-body { flex: 1; min-width: 0; }
.adm-card-name { font-size: 16px; font-weight: 700; color: var(--clay-deep); margin-bottom: 3px; }
.adm-card-meta { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.adm-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* action buttons */
.adm-btn {
  padding: 6px 13px;
  border: none;
  border-radius: 8px;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
.adm-btn:disabled { opacity: 0.4; cursor: default; }
.adm-btn-approve { background: #16a34a; color: #fff; }
.adm-btn-reject  { background: #dc2626; color: #fff; }
.adm-btn-pending { background: #d97706; color: #fff; }
.adm-btn-edit    { background: var(--clay); color: #fff; }
.adm-btn-delete  { background: #ef4444; color: #fff; }
.adm-btn-add     { background: var(--clay); color: #fff; padding: 9px 20px; border-radius: 10px; font-size: 14px; }

/* status badge */
.adm-status {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}
.adm-status-approved { background: rgba(22,163,74,0.12); color: #16a34a; }
.adm-status-rejected { background: rgba(220,38,38,0.12); color: #dc2626; }
.adm-status-pending  { background: rgba(217,119,6,0.12);  color: #d97706; }

/* categories section */
.adm-cats-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.adm-cat-row {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(14px);
  border: 1.5px solid rgba(255,255,255,0.88);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}
[data-theme="dark"] .adm-cat-row {
  background: rgba(15,35,71,0.60);
  border-color: rgba(255,255,255,0.08);
}
.adm-cat-icon { font-size: 22px; width: 32px; text-align: center; }
.adm-cat-name { flex: 1; font-weight: 700; color: var(--clay-deep); }
.adm-cat-order { font-size: 12px; color: var(--text-2); margin-left: 8px; }

/* modal overlay */
.adm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,22,40,0.55);
  backdrop-filter: blur(4px);
  z-index: 900;
  align-items: center;
  justify-content: center;
}
.adm-overlay.open { display: flex; }
.adm-modal {
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(24px);
  border: 1.5px solid rgba(255,255,255,0.92);
  border-radius: 20px;
  padding: 28px 24px;
  width: 440px;
  max-width: 95vw;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 16px 48px rgba(27,58,107,0.16);
}
[data-theme="dark"] .adm-modal {
  background: rgba(15,35,71,0.92);
  border-color: rgba(255,255,255,0.10);
}
.adm-modal h3 {
  margin: 0 0 20px;
  font-size: 18px;
  color: var(--clay-deep);
}
.adm-field { margin-bottom: 14px; }
.adm-field label {
  display: block;
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 5px;
  font-weight: 600;
}
.adm-field input, .adm-field textarea, .adm-field select {
  width: 100%;
  box-sizing: border-box;
  background: rgba(255,255,255,0.80);
  border: 1.5px solid rgba(27,58,107,0.15);
  border-radius: 10px;
  padding: 10px 13px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--text-1);
}
[data-theme="dark"] .adm-field input,
[data-theme="dark"] .adm-field textarea,
[data-theme="dark"] .adm-field select {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
  color: #e8eaf6;
}
.adm-field textarea { resize: vertical; min-height: 70px; }
.adm-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: flex-end;
}
.adm-btn-save   { background: var(--clay); color: #fff; padding: 9px 22px; border-radius: 10px; border: none; font-family:'Cairo',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
.adm-btn-cancel { background: rgba(27,58,107,0.08); color: var(--clay); padding: 9px 22px; border-radius: 10px; border: 1.5px solid rgba(27,58,107,0.15); font-family:'Cairo',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
.adm-btn-save:disabled { opacity: 0.5; cursor: default; }
.adm-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
.adm-msg.ok  { color: #16a34a; }
.adm-msg.err { color: #dc2626; }

/* image preview */
#editImagePreview { margin-top: 8px; display: none; }
#editImagePreview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.80); }

/* section panel */
.adm-section { display: none; }
.adm-section.active { display: block; }

.adm-empty { text-align: center; color: var(--text-2); padding: 40px 0; font-size: 15px; }
</style>
</head>
<body>

<!-- ── Login ── -->
<div class="adm-login" id="loginBox">
  <h2>🔒 لوحة الإدارة</h2>
  <input id="user" placeholder="اسم المستخدم" autocomplete="username">
  <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="adm-login-btn" onclick="login()">دخول</button>
</div>

<!-- ── Main Panel ── -->
<div class="adm-wrap" id="panel" style="display:none">

  <div class="adm-header">
    <h2>🏗 لوحة إدارة بُنيان</h2>
    <button class="adm-logout-btn" onclick="logout()">خروج</button>
  </div>

  <div class="adm-tabs">
    <button class="adm-tab active" onclick="showTab('companies',this)">🏢 الشركات</button>
    <button class="adm-tab" onclick="showTab('subscriptions',this);loadSubscriptions()">💳 الاشتراكات</button>
    <button class="adm-tab" onclick="showTab('projects',this);loadAdminProjects()">🏗 المشاريع</button>
    <button class="adm-tab" onclick="showTab('reviews',this);loadAdminReviews()">⭐ التقييمات</button>
    <button class="adm-tab" onclick="showTab('users',this);loadUsers()">👥 المستخدمون</button>
    <button class="adm-tab" onclick="showTab('categories',this)">📂 التصنيفات</button>
    <button class="adm-tab" onclick="showTab('stats',this);loadStats()">📊 الإحصائيات</button>
  </div>

  <!-- Companies Section -->
  <div class="adm-section active" id="sec-companies">
    <div id="companiesList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Subscriptions Section -->
  <div class="adm-section" id="sec-subscriptions">
    <div class="adm-cats-header">
      <span style="font-size:16px;font-weight:700;color:var(--clay-deep);flex:1">طلبات الاشتراك</span>
      <select id="subFilterStatus" onchange="loadSubscriptions()" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(27,58,107,0.18);font-family:'Cairo',sans-serif;font-size:13px;">
        <option value="">كل الطلبات</option>
        <option value="pending">قيد المراجعة</option>
        <option value="approved">مقبولة</option>
        <option value="rejected">مرفوضة</option>
      </select>
    </div>
    <div id="subscriptionsList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Projects Section -->
  <div class="adm-section" id="sec-projects">
    <div class="adm-cats-header">
      <span style="font-size:16px;font-weight:700;color:var(--clay-deep);flex:1">إدارة المشاريع</span>
      <select id="projFilterStatus" onchange="loadAdminProjects()" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(27,58,107,0.18);font-family:'Cairo',sans-serif;font-size:13px;">
        <option value="">كل المشاريع</option>
        <option value="published">منشور</option>
        <option value="pending">قيد المراجعة</option>
        <option value="closed">مغلق</option>
      </select>
    </div>
    <div id="adminProjectsList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Reviews Section -->
  <div class="adm-section" id="sec-reviews">
    <div class="adm-cats-header">
      <span style="font-size:16px;font-weight:700;color:var(--clay-deep);flex:1">مراجعة التقييمات</span>
      <select id="revFilterStatus" onchange="loadAdminReviews()" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(27,58,107,0.18);font-family:'Cairo',sans-serif;font-size:13px;">
        <option value="pending">قيد المراجعة</option>
        <option value="approved">معتمدة</option>
        <option value="">الكل</option>
      </select>
    </div>
    <div id="adminReviewsList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Users Section -->
  <div class="adm-section" id="sec-users">
    <div class="adm-cats-header">
      <span style="font-size:16px;font-weight:700;color:var(--clay-deep);flex:1">المستخدمون</span>
      <select id="usersFilter" onchange="loadUsers()" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(27,58,107,0.18);font-family:'Cairo',sans-serif;font-size:13px;">
        <option value="users">المستخدمون</option>
        <option value="companies">الشركات</option>
      </select>
    </div>
    <div id="usersList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Categories Section -->
  <div class="adm-section" id="sec-categories">
    <div class="adm-cats-header">
      <span style="font-size:16px;font-weight:700;color:var(--clay-deep);flex:1">التصنيفات (من قاعدة البيانات)</span>
      <button class="adm-btn adm-btn-add" onclick="openCatModal()">➕ إضافة تصنيف</button>
    </div>
    <div id="categoriesList"><div class="adm-empty">جارٍ التحميل…</div></div>
  </div>

  <!-- Stats Section -->
  <div class="adm-section" id="sec-stats">
    <div style="font-size:16px;font-weight:700;color:var(--clay-deep);margin-bottom:20px">📊 إحصائيات النظام</div>
    <div id="statsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px">
      <div class="adm-empty">جارٍ التحميل…</div>
    </div>
    <div id="statsDetails"></div>
  </div>

</div>

<!-- ── Edit Company Modal ── -->
<div class="adm-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="adm-modal">
    <h3>✏️ تعديل بيانات الشركة</h3>
    <input type="hidden" id="editId">
    <div class="adm-field"><label>الاسم</label><input type="text" id="editName"></div>
    <div class="adm-field"><label>المدينة</label><input type="text" id="editCity"></div>
    <div class="adm-field"><label>الهاتف</label><input type="text" id="editPhone"></div>
    <div class="adm-field"><label>البريد الإلكتروني</label><input type="email" id="editEmail"></div>
    <div class="adm-field"><label>نبذة</label><textarea id="editDesc"></textarea></div>
    <div class="adm-field">
      <label>الصورة / الشعار (اتركه فارغاً للإبقاء على الحالية)</label>
      <input type="file" id="editImage" accept="image/jpeg,image/png,image/webp">
      <div id="editImagePreview"><img id="editImageThumb" src="" alt="preview"></div>
    </div>
    <div class="adm-msg" id="editMsg"></div>
    <div class="adm-modal-actions">
      <button class="adm-btn-cancel" onclick="closeEdit()">إلغاء</button>
      <button class="adm-btn-save" id="editSaveBtn" onclick="saveEdit()">حفظ</button>
    </div>
  </div>
</div>

<!-- ── Category Modal ── -->
<div class="adm-overlay" id="catOverlay" onclick="if(event.target===this)closeCatModal()">
  <div class="adm-modal">
    <h3 id="catModalTitle">➕ إضافة تصنيف</h3>
    <input type="hidden" id="catId">
    <div class="adm-field"><label>الاسم بالعربية</label><input type="text" id="catNameAr" placeholder="مثال: مقاولات عامة"></div>
    <div class="adm-field"><label>الاسم بالإنجليزية</label><input type="text" id="catNameEn" placeholder="General Contracting"></div>
    <div class="adm-field"><label>الأيقونة (إيموجي)</label><input type="text" id="catIcon" placeholder="🏗" maxlength="4"></div>
    <div class="adm-field"><label>ترتيب العرض</label><input type="number" id="catOrder" placeholder="1" min="0"></div>
    <div class="adm-msg" id="catMsg"></div>
    <div class="adm-modal-actions">
      <button class="adm-btn-cancel" onclick="closeCatModal()">إلغاء</button>
      <button class="adm-btn-save" id="catSaveBtn" onclick="saveCat()">حفظ</button>
    </div>
  </div>
</div>

<script>
const API_URL = "";
let TOKEN = "";

/* ── Image preview ── */
document.getElementById('editImage').addEventListener('change', () => {
  const file = document.getElementById('editImage').files[0];
  if (!file) return;
  document.getElementById('editImageThumb').src = URL.createObjectURL(file);
  document.getElementById('editImagePreview').style.display = 'block';
});

/* ── Auth ── */
async function login() {
  const username = document.getElementById('user').value;
  const password = document.getElementById('pass').value;
  const res = await fetch(`${API_URL}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const data = await res.json();
  if (data.token) {
    TOKEN = data.token;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadCompanies();
    loadCategories();
  } else {
    alert('خطأ في تسجيل الدخول');
  }
}

function logout() {
  TOKEN = '';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('panel').style.display = 'none';
}

/* ── Tabs ── */
function showTab(name, el) {
  document.querySelectorAll('.adm-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.adm-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  el.classList.add('active');
}

/* ── Companies ── */
async function loadCompanies() {
  const res = await fetch(`${API_URL}/admin/companies`, {
    headers: { 'Authorization': TOKEN }
  });
  if (res.status === 401) { logout(); return; }
  const data = await res.json();
  const list = document.getElementById('companiesList');
  if (!data.length) { list.innerHTML = '<div class="adm-empty">لا توجد شركات</div>'; return; }

  list.innerHTML = data.map(c => {
    const statusClass = c.status === 'approved' ? 'adm-status-approved' : c.status === 'rejected' ? 'adm-status-rejected' : 'adm-status-pending';
    const statusLabel = c.status === 'approved' ? '✔ معتمدة' : c.status === 'rejected' ? '✘ مرفوضة' : '⏳ قيد المراجعة';
    const thumb = c.image_url
      ? `<img class="adm-card-thumb" src="${c.image_url}" alt="${c.name}" onerror="this.style.display='none'">`
      : `<div class="adm-card-icon">🏢</div>`;
    return `
    <div class="adm-card">
      ${thumb}
      <div class="adm-card-body">
        <div class="adm-card-name">${c.name}</div>
        <div class="adm-card-meta">${c.city || ''} · ${c.spec || ''} · ${c.phone || ''}</div>
        <span class="adm-status ${statusClass}">${statusLabel}</span>
        <div class="adm-card-actions" style="margin-top:10px">
          <button class="adm-btn adm-btn-approve" onclick="setStatus(${c.id},'approved')" ${c.status==='approved'?'disabled':''}>✔ موافقة</button>
          <button class="adm-btn adm-btn-reject"  onclick="setStatus(${c.id},'rejected')" ${c.status==='rejected'?'disabled':''}>✘ رفض</button>
          <button class="adm-btn adm-btn-pending" onclick="setStatus(${c.id},'pending')"  ${c.status==='pending' ?'disabled':''}>⏳ مراجعة</button>
          <button class="adm-btn adm-btn-edit"    onclick='openEdit(${JSON.stringify(c)})'>✏️ تعديل</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function setStatus(id, status) {
  const res = await fetch(`${API_URL}/companies/${id}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
    body: JSON.stringify({ status }),
  });
  if (res.status === 401) { logout(); return; }
  if (res.ok) await loadCompanies();
}

/* ── Edit Company Modal ── */
function openEdit(c) {
  document.getElementById('editId').value    = c.id;
  document.getElementById('editName').value  = c.name  || '';
  document.getElementById('editCity').value  = c.city  || '';
  document.getElementById('editPhone').value = c.phone || '';
  document.getElementById('editEmail').value = c.email || '';
  document.getElementById('editDesc').value  = c.desc  || '';
  document.getElementById('editImage').value = '';
  document.getElementById('editImagePreview').style.display = 'none';
  document.getElementById('editMsg').textContent = '';
  document.getElementById('editMsg').className   = 'adm-msg';
  document.getElementById('editSaveBtn').disabled = false;
  document.getElementById('editOverlay').classList.add('open');
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
}

async function saveEdit() {
  const id  = document.getElementById('editId').value;
  const btn = document.getElementById('editSaveBtn');
  const msg = document.getElementById('editMsg');
  btn.disabled = true;
  msg.textContent = 'جارٍ الحفظ...';
  msg.className = 'adm-msg';
  try {
    let image_url;
    const imgFile = document.getElementById('editImage').files[0];
    if (imgFile) {
      const fd = new FormData();
      fd.append('file', imgFile);
      const upRes = await fetch(`${API_URL}/upload`, { method: 'POST', body: fd, signal: AbortSignal.timeout(30000) });
      if (!upRes.ok) { const e = await upRes.json().catch(()=>({})); throw new Error(e.detail || `خطأ رفع الصورة (${upRes.status})`); }
      image_url = (await upRes.json()).url || '';
    }
    const payload = {
      name:  document.getElementById('editName').value.trim()  || undefined,
      city:  document.getElementById('editCity').value.trim()  || undefined,
      phone: document.getElementById('editPhone').value.trim() || undefined,
      email: document.getElementById('editEmail').value.trim() || undefined,
      desc:  document.getElementById('editDesc').value.trim()  || undefined,
    };
    if (image_url !== undefined) payload.image_url = image_url;
    const res = await fetch(`${API_URL}/companies/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
      body: JSON.stringify(payload),
    });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || `خطأ (${res.status})`); }
    msg.textContent = '✔ تم الحفظ بنجاح';
    msg.className = 'adm-msg ok';
    setTimeout(() => { closeEdit(); loadCompanies(); }, 800);
  } catch(e) {
    msg.textContent = '✘ ' + e.message;
    msg.className = 'adm-msg err';
    btn.disabled = false;
  }
}

/* ── Categories ── */
async function loadCategories() {
  const res = await fetch(`${API_URL}/categories`);
  const cats = await res.json();
  const list = document.getElementById('categoriesList');
  if (!cats.length) { list.innerHTML = '<div class="adm-empty">لا توجد تصنيفات</div>'; return; }
  list.innerHTML = cats.map(cat => `
    <div class="adm-cat-row">
      <span class="adm-cat-icon">${cat.icon}</span>
      <span class="adm-cat-name">${cat.name_ar}</span>
      <span class="adm-cat-order">#${cat.sort_order}</span>
      <div style="display:flex;gap:6px">
        <button class="adm-btn adm-btn-edit"   onclick='openCatModal(${JSON.stringify(cat)})'>✏️</button>
        <button class="adm-btn adm-btn-delete" onclick="deleteCat(${cat.id})">🗑</button>
      </div>
    </div>
  `).join('');
}

function openCatModal(cat) {
  document.getElementById('catId').value     = cat ? cat.id : '';
  document.getElementById('catNameAr').value = cat ? cat.name_ar : '';
  document.getElementById('catNameEn').value = cat ? (cat.name_en || '') : '';
  document.getElementById('catIcon').value   = cat ? cat.icon : '🏗';
  document.getElementById('catOrder').value  = cat ? cat.sort_order : '';
  document.getElementById('catModalTitle').textContent = cat ? '✏️ تعديل تصنيف' : '➕ إضافة تصنيف';
  document.getElementById('catMsg').textContent = '';
  document.getElementById('catMsg').className   = 'adm-msg';
  document.getElementById('catSaveBtn').disabled = false;
  document.getElementById('catOverlay').classList.add('open');
}

function closeCatModal() {
  document.getElementById('catOverlay').classList.remove('open');
}

async function saveCat() {
  const id  = document.getElementById('catId').value;
  const btn = document.getElementById('catSaveBtn');
  const msg = document.getElementById('catMsg');
  btn.disabled = true;
  msg.textContent = 'جارٍ الحفظ...';
  const payload = {
    name_ar:    document.getElementById('catNameAr').value.trim(),
    name_en:    document.getElementById('catNameEn').value.trim(),
    icon:       document.getElementById('catIcon').value.trim() || '🏗',
    sort_order: parseInt(document.getElementById('catOrder').value) || 0,
  };
  try {
    const res = await fetch(id ? `${API_URL}/categories/${id}` : `${API_URL}/categories`, {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
      body: JSON.stringify(payload),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || `خطأ (${res.status})`); }
    msg.textContent = '✔ تم الحفظ';
    msg.className = 'adm-msg ok';
    setTimeout(() => { closeCatModal(); loadCategories(); }, 700);
  } catch(e) {
    msg.textContent = '✘ ' + e.message;
    msg.className = 'adm-msg err';
    btn.disabled = false;
  }
}

async function deleteCat(id) {
  if (!confirm('حذف هذا التصنيف؟')) return;
  await fetch(`${API_URL}/categories/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': TOKEN },
  });
  loadCategories();
}

/* ── Subscriptions ── */
async function loadSubscriptions() {
  const status = document.getElementById('subFilterStatus').value;
  const url = status ? `${API_URL}/admin/subscription-requests?status=${status}` : `${API_URL}/admin/subscription-requests`;
  const res = await fetch(url, { headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  const list = document.getElementById('subscriptionsList');
  if (!res.ok) { list.innerHTML = '<div class="adm-empty">خطأ في التحميل</div>'; return; }
  const data = await res.json();
  if (!data.length) { list.innerHTML = '<div class="adm-empty">لا توجد طلبات</div>'; return; }
  const statusLabel = { pending: '⏳ قيد المراجعة', approved: '✔ مقبول', rejected: '✘ مرفوض' };
  const statusClass = { pending: 'adm-status-pending', approved: 'adm-status-approved', rejected: 'adm-status-rejected' };
  list.innerHTML = data.map(r => `
    <div class="adm-card">
      <div class="adm-card-body">
        <div class="adm-card-name">${r.company_name || 'شركة #' + r.company_id}</div>
        <div class="adm-card-meta">الباقة: <strong>${r.plan_code || r.plan_id}</strong> · طُلب: ${r.created_at ? r.created_at.slice(0,10) : ''}</div>
        ${r.notes ? `<div style="font-size:12px;color:var(--text-2);margin:4px 0">${r.notes}</div>` : ''}
        <span class="adm-status ${statusClass[r.status]||'adm-status-pending'}">${statusLabel[r.status]||r.status}</span>
        ${r.status === 'pending' ? `
        <div class="adm-card-actions" style="margin-top:10px">
          <button class="adm-btn adm-btn-approve" onclick="approveSubscription(${r.id})">✔ موافقة</button>
          <button class="adm-btn adm-btn-reject"  onclick="rejectSubscription(${r.id})">✘ رفض</button>
        </div>` : ''}
      </div>
    </div>`).join('');
}

async function approveSubscription(id) {
  const months = parseInt(prompt('عدد الأشهر (1-12):', '1')) || 1;
  const res = await fetch(`${API_URL}/admin/subscription-requests/${id}/approve`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
    body: JSON.stringify({ months }),
  });
  if (!res.ok) { const e = await res.json().catch(()=>{}); alert('خطأ: ' + (e?.detail || res.status)); return; }
  loadSubscriptions();
}
async function rejectSubscription(id) {
  const notes = prompt('سبب الرفض (اختياري):') || '';
  await fetch(`${API_URL}/admin/subscription-requests/${id}/reject`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
    body: JSON.stringify({ notes }),
  });
  loadSubscriptions();
}

/* ── Projects ── */
async function loadAdminProjects() {
  const status = document.getElementById('projFilterStatus').value;
  const url = status ? `${API_URL}/admin/projects?status=${status}` : `${API_URL}/admin/projects`;
  const res = await fetch(url, { headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  const list = document.getElementById('adminProjectsList');
  if (!res.ok) { list.innerHTML = '<div class="adm-empty">خطأ في التحميل</div>'; return; }
  const data = await res.json();
  if (!data.length) { list.innerHTML = '<div class="adm-empty">لا توجد مشاريع</div>'; return; }
  const sClass = { published:'adm-status-approved', pending:'adm-status-pending', closed:'adm-status-rejected', cancelled:'adm-status-rejected', contracted:'adm-status-approved' };
  list.innerHTML = data.map(p => `
    <div class="adm-card">
      <div class="adm-card-body">
        <div class="adm-card-name">${p.title||'مشروع #'+p.id}</div>
        <div class="adm-card-meta">${p.city||''} · ${p.category||''} · ${(p.created_at||'').slice(0,10)}</div>
        <span class="adm-status ${sClass[p.status]||'adm-status-pending'}">${p.status}</span>
        <div class="adm-card-actions" style="margin-top:10px">
          <button class="adm-btn adm-btn-approve" onclick="setProjectStatus(${p.id},'published')" ${p.status==='published'?'disabled':''}>✔ نشر</button>
          <button class="adm-btn adm-btn-pending" onclick="setProjectStatus(${p.id},'pending')"   ${p.status==='pending'?'disabled':''}>⏳ مراجعة</button>
          <button class="adm-btn adm-btn-reject"  onclick="setProjectStatus(${p.id},'closed')"    ${p.status==='closed'?'disabled':''}>✘ إغلاق</button>
        </div>
      </div>
    </div>`).join('');
}

async function setProjectStatus(id, status) {
  await fetch(`${API_URL}/admin/projects/${id}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
    body: JSON.stringify({ status }),
  });
  loadAdminProjects();
}

/* ── Reviews ── */
async function loadAdminReviews() {
  const status = document.getElementById('revFilterStatus').value;
  const url = `${API_URL}/admin/reviews${status ? '?status=' + status : ''}`;
  const res = await fetch(url, { headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  const list = document.getElementById('adminReviewsList');
  if (!res.ok) { list.innerHTML = '<div class="adm-empty">خطأ في التحميل</div>'; return; }
  const data = await res.json();
  if (!data.length) { list.innerHTML = '<div class="adm-empty">لا توجد تقييمات</div>'; return; }
  list.innerHTML = data.map(r => `
    <div class="adm-card">
      <div class="adm-card-body">
        <div class="adm-card-name">${r.client_name||'مجهول'} <span style="color:var(--sand)">${'★'.repeat(r.rating||0)}</span></div>
        <div class="adm-card-meta">شركة: ${r.company_name||'#'+r.company_id} · ${(r.created_at||'').slice(0,10)}</div>
        ${r.comment ? `<div style="font-size:13px;color:var(--text-2);margin:6px 0">"${r.comment}"</div>` : ''}
        <span class="adm-status ${r.status==='approved'?'adm-status-approved':'adm-status-pending'}">${r.status==='approved'?'✔ معتمد':'⏳ قيد المراجعة'}</span>
        <div class="adm-card-actions" style="margin-top:10px">
          ${r.status!=='approved' ? `<button class="adm-btn adm-btn-approve" onclick="approveReview(${r.id})">✔ اعتماد</button>` : ''}
          ${r.status==='approved'  ? `<button class="adm-btn adm-btn-reject"  onclick="rejectReview(${r.id})">✘ إلغاء الاعتماد</button>` : `<button class="adm-btn adm-btn-reject" onclick="rejectReview(${r.id})">✘ رفض</button>`}
        </div>
      </div>
    </div>`).join('');
}

async function approveReview(id) {
  const res = await fetch(`${API_URL}/admin/reviews/${id}/approve`, { method: 'PUT', headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  if (res.ok) await loadAdminReviews();
}
async function rejectReview(id) {
  const res = await fetch(`${API_URL}/admin/reviews/${id}/reject`, { method: 'PUT', headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  if (res.ok) await loadAdminReviews();
}

/* ── Users ── */
async function loadUsers() {
  const type = document.getElementById('usersFilter').value;
  const list = document.getElementById('usersList');
  list.innerHTML = '<div class="adm-empty">جارٍ التحميل…</div>';

  if (type === 'companies') {
    const res = await fetch(`${API_URL}/admin/companies`, { headers: { 'Authorization': TOKEN } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    list.innerHTML = data.map(c => `
      <div class="adm-card">
        <div class="adm-card-body">
          <div class="adm-card-name">${c.name}</div>
          <div class="adm-card-meta">${c.email||''} · ${c.city||''} · ${c.phone||''}</div>
          <span class="adm-status ${c.status==='approved'?'adm-status-approved':c.status==='rejected'?'adm-status-rejected':'adm-status-pending'}">${c.status==='approved'?'✔ معتمدة':c.status==='rejected'?'✘ مرفوضة':'⏳ قيد المراجعة'}</span>
        </div>
      </div>`).join('') || '<div class="adm-empty">لا توجد شركات</div>';
  } else {
    const res = await fetch(`${API_URL}/admin/users`, { headers: { 'Authorization': TOKEN } });
    if (!res.ok) { list.innerHTML = '<div class="adm-empty">لا يوجد endpoint للمستخدمين بعد</div>'; return; }
    const data = await res.json();
    list.innerHTML = data.map(u => `
      <div class="adm-card">
        <div class="adm-card-body">
          <div class="adm-card-name">${u.name||u.email}</div>
          <div class="adm-card-meta">${u.email||''} · ${(u.created_at||'').slice(0,10)}</div>
        </div>
      </div>`).join('') || '<div class="adm-empty">لا يوجد مستخدمون</div>';
  }
}

/* ── Stats ── */
async function loadStats() {
  const res = await fetch(`${API_URL}/admin/system-status`, { headers: { 'Authorization': TOKEN } });
  if (res.status === 401) { logout(); return; }
  if (!res.ok) { document.getElementById('statsGrid').innerHTML = '<div class="adm-empty">خطأ في التحميل</div>'; return; }
  const d = await res.json();
  const co = d.companies || {};
  const pr = d.projects  || {};
  const re = d.reviews   || {};
  const su = d.subscriptions || {};
  const cards = [
    { label:'إجمالي الشركات',   val: co.total     || 0, sub: `معتمدة: ${co.approved||0} · قيد المراجعة: ${co.pending||0}` },
    { label:'إجمالي المشاريع',  val: pr.total     || 0, sub: `منشورة: ${pr.published||0}` },
    { label:'التقييمات',        val: re.total     || 0, sub: `معتمدة: ${re.approved||0} · قيد المراجعة: ${re.pending||0}` },
    { label:'الاشتراكات الفعّالة', val: su.active  || 0, sub: `إجمالي: ${su.total||0}` },
  ];
  document.getElementById('statsGrid').innerHTML = cards.map(c => `
    <div style="background:rgba(255,255,255,0.72);border:1.5px solid rgba(255,255,255,0.88);border-radius:14px;padding:18px 16px;text-align:center;backdrop-filter:blur(12px)">
      <div style="font-size:28px;font-weight:900;color:var(--clay-deep)">${c.val}</div>
      <div style="font-size:13px;font-weight:700;color:var(--clay);margin:4px 0">${c.label}</div>
      <div style="font-size:11px;color:var(--text-2)">${c.sub}</div>
    </div>`).join('');
}
</script>
</body>
</html>
